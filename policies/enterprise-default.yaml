# kafka-security-scanner policy — enterprise-default (118 controls)
# Sourced from https://github.com/conduktor/kafka-security-controls — that repo
# is the canonical home for the regulatory mappings (CWE, NIST 800-53,
# PCI-DSS 4.0, SOC2, ISO 27001). This file is the executable CEL projection.
# CEL conditions evaluated by cel-java.
# Controls requiring Connect/Schema Registry/REST/MM2/Streams collectors are marked [ecosystem].

name: enterprise-default
version: "3.0.0"
description: "Full compliance policy: 118 controls mapped to PCI-DSS 4.0, SOC 2, ISO 27001, NIST 800-53, CIS"
framework: "PCI-DSS 4.0, SOC 2 Type II, ISO/IEC 27001, NIST 800-53"

controls:
  # ═══════════════ AUTHENTICATION (14) ═══════════════
  - &KAFKA-AUTH-001
    id: KAFKA-AUTH-001
    title: "SASL/SCRAM configured for client authentication"
    severity: high
    category: security
    description: "Enable SASL/SCRAM-SHA-256 or SASL/SCRAM-SHA-512 for client authentication"
    condition: "brokers.all(b, 'sasl' in b && b.sasl.enabled && b.sasl.mechanisms.exists(m, m in ['SCRAM-SHA-256', 'SCRAM-SHA-512']))"
    message: "SASL/SCRAM is not configured — clients can connect without authentication"
    remediation: "Configure sasl.mechanism and sasl.jaas.config on brokers and clients"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-004
    title: "SASL/PLAIN must be paired with TLS"
    severity: high
    category: security
    description: "SASL/PLAIN must only be used with TLS (SASL_SSL protocol). Prefer SCRAM-SHA-256/512"
    condition: "brokers.all(b, !('sasl' in b) || !b.sasl.enabled || !('PLAIN' in b.sasl.mechanisms) || b.listeners.all(l, l.protocol == 'SASL_SSL'))"
    message: "SASL/PLAIN used without TLS — credentials sent in cleartext"
    remediation: "Use SASL_SSL protocol or switch to SCRAM-SHA-512"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "SC-8"], cwe: ["319", "522"]}

  - id: KAFKA-AUTH-005
    title: "mTLS client certificate authentication"
    severity: high
    category: security
    description: "Implement mutual TLS where clients present certificates signed by a trusted CA"
    condition: "brokers.all(b, 'tls' in b && b.tls.enabled)"
    message: "mTLS not configured — client certificate auth provides strongest identity verification"
    remediation: "Configure ssl.client.auth=required on brokers"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5", "SC-17"], cwe: ["287", "295", "297"]}

  - id: KAFKA-AUTH-006
    title: "SCRAM credential rotation configured"
    severity: medium
    category: security
    description: "Implement regular rotation of SCRAM credentials"
    condition: "brokers.all(b, 'sasl' in b && b.sasl.enabled && b.sasl.mechanisms.exists(m, m.startsWith('SCRAM')))"
    message: "SCRAM credentials should be rotated regularly — document rotation procedure"
    remediation: "Rotate SCRAM credentials via kafka-configs.sh every 90 days"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5"], cwe: ["798", "522"]}

  - id: KAFKA-AUTH-007
    title: "Certificate rotation before expiry"
    severity: high
    category: security
    description: "Implement automated certificate rotation before expiry. Kafka 2.5+ supports dynamic keystore updates"
    condition: "brokers.all(b, 'tls' in b && b.tls.enabled)"
    message: "Ensure certificate rotation is automated — expired certs cause outages"
    remediation: "Use short-lived certificates and automate rotation. Kafka 2.5+ supports dynamic SSL updates"
    compliance: {pci_dss: ["4.1"], nist: ["IA-5", "SC-12"], cwe: ["324"]}

  - id: KAFKA-AUTH-008
    title: "SASL for inter-broker communication"
    severity: high
    category: security
    description: "Configure SASL for inter-broker communication"
    condition: "brokers.all(b, 'config' in b && 'sasl.mechanism.inter.broker.protocol' in b.config)"
    message: "Inter-broker SASL not configured"
    remediation: "Set security.inter.broker.protocol=SASL_SSL and sasl.mechanism.inter.broker.protocol"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-009
    title: "SASL mechanism allowlist configured"
    severity: medium
    category: security
    description: "Restrict enabled SASL mechanisms to only required ones"
    condition: "brokers.all(b, 'config' in b && 'sasl.enabled.mechanisms' in b.config)"
    message: "SASL mechanism allowlist not explicitly configured"
    remediation: "Set sasl.enabled.mechanisms to only required mechanisms (e.g. SCRAM-SHA-512)"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-010
    title: "SSL principal mapping rules configured"
    severity: medium
    category: security
    description: "Configure ssl.principal.mapping.rules to map certificate DNs to canonical principals"
    condition: "true"
    message: "SSL principal mapping rules should be configured for mTLS environments"
    remediation: "Set ssl.principal.mapping.rules to prevent ambiguous identity mapping"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2"], cwe: ["287", "295"]}

  - id: KAFKA-AUTH-011
    title: "OAuth token lifetime enforcement"
    severity: medium
    category: security
    description: "Use short-lived OAuth/OIDC tokens for SASL/OAUTHBEARER"
    condition: "true"
    message: "If using OAuth, ensure short-lived tokens with audience/issuer validation"
    remediation: "Configure token lifetime < 1 hour and validate issuer/audience"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "IA-8"], cwe: ["287", "522"]}

  - id: KAFKA-AUTH-012
    title: "Per-tenant principals configured"
    severity: medium
    category: security
    description: "Use unique principals and client IDs per application or tenant"
    condition: "true"
    message: "Ensure unique principals per application for audit and quota isolation"
    remediation: "Assign unique service accounts per application/tenant"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-013
    title: "Delegation tokens for long-running apps"
    severity: medium
    category: security
    description: "Use delegation tokens for Kafka Streams, Spark, Flink to avoid storing credentials"
    condition: "true"
    message: "Delegation tokens should be used for long-running stream processors"
    remediation: "Configure delegation.token.master.key and use kafka-delegation-tokens.sh"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "IA-2"], cwe: ["287", "522"]}

  - id: KAFKA-AUTH-014
    title: "Connection re-authentication enforced"
    severity: medium
    category: security
    description: "Force periodic re-authentication using connections.max.reauth.ms"
    condition: "brokers.all(b, 'config' in b && 'connections.max.reauth.ms' in b.config)"
    message: "Connection re-authentication not configured — compromised credentials persist"
    remediation: "Set connections.max.reauth.ms to enforce periodic re-auth (Kafka 2.2+)"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "IA-11"], cwe: ["287", "613"]}

  # ═══════════════ ENCRYPTION (11) ═══════════════
  - id: KAFKA-ENC-001
    title: "Inter-broker TLS encryption enabled"
    severity: critical
    category: security
    description: "Enable TLS encryption between brokers"
    condition: "brokers.all(b, 'config' in b && 'security.inter.broker.protocol' in b.config && b.config['security.inter.broker.protocol'] in ['SSL', 'SASL_SSL'])"
    message: "Inter-broker communication is not encrypted — replication traffic exposed"
    remediation: "Set security.inter.broker.protocol=SSL or SASL_SSL"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-ENC-002
    title: "Client-broker TLS encryption enabled"
    severity: critical
    category: security
    description: "All client-facing listeners must use SSL or SASL_SSL protocol"
    condition: "brokers.all(b, b.listeners.all(l, l.protocol in ['SSL', 'SASL_SSL']))"
    message: "One or more client listeners use PLAINTEXT — data exposed in transit"
    remediation: "Configure listeners with SSL:// or SASL_SSL:// protocol"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-ENC-003
    title: "ZooKeeper TLS enabled"
    severity: high
    category: security
    description: "Enable TLS for broker-to-ZooKeeper communication"
    condition: "cluster.mode != 'zookeeper' || brokers.all(b, 'config' in b && 'zookeeper.ssl.client.enable' in b.config && b.config['zookeeper.ssl.client.enable'] == 'true')"
    message: "ZooKeeper communication is not encrypted"
    remediation: "Set zookeeper.ssl.client.enable=true"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-ENC-004
    title: "Disk encryption for log directories"
    severity: high
    category: security
    description: "Enable filesystem-level encryption for Kafka log directories"
    condition: "true"
    covered_by_kafka_flavor: [confluent-cloud, aws-msk, aiven, redpanda-cloud, azure-eventhubs]
    message: "Verify disk encryption (dm-crypt/LUKS/cloud KMS) is enabled on log.dirs"
    remediation: "Use dm-crypt, LUKS, or cloud provider encryption for log directories"
    compliance: {pci_dss: ["3.4"], nist: ["SC-28"], cwe: ["311", "312"]}

  - id: KAFKA-ENC-005
    title: "TLS protocol version >= 1.2 enforced"
    severity: high
    category: security
    description: "Enforce TLS 1.2 or 1.3 minimum. Disable SSLv3, TLS 1.0, 1.1"
    condition: "brokers.all(b, 'config' in b && 'ssl.enabled.protocols' in b.config && !b.config['ssl.enabled.protocols'].contains('TLSv1.0') && !b.config['ssl.enabled.protocols'].contains('TLSv1.1'))"
    message: "Older TLS versions (1.0/1.1) may be enabled — vulnerable to POODLE/BEAST"
    remediation: "Set ssl.enabled.protocols=TLSv1.2,TLSv1.3"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["326", "327"]}

  - id: KAFKA-ENC-006
    title: "Strong cipher suites configured"
    severity: medium
    category: security
    description: "Configure strong AEAD cipher suites (GCM, ChaCha20-Poly1305)"
    condition: "brokers.all(b, 'config' in b && 'ssl.cipher.suites' in b.config)"
    message: "Cipher suites not explicitly configured — may use weak defaults"
    remediation: "Set ssl.cipher.suites to TLS_AES_256_GCM_SHA384 and other AEAD ciphers"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["326", "327"]}

  - id: KAFKA-ENC-007
    title: "CA certificate validation configured"
    severity: high
    category: security
    description: "Configure ssl.truststore with trusted CA certificates"
    condition: "brokers.all(b, 'config' in b && 'ssl.truststore.location' in b.config)"
    message: "Truststore not configured — certificates not validated"
    remediation: "Set ssl.truststore.location and ssl.truststore.password"
    compliance: {pci_dss: ["4.1"], nist: ["SC-17", "SC-12"], cwe: ["295", "296", "297"]}

  - id: KAFKA-ENC-008
    title: "Hostname verification enabled"
    severity: medium
    category: security
    description: "Enable ssl.endpoint.identification.algorithm=https"
    condition: "brokers.all(b, 'config' in b && (!('ssl.endpoint.identification.algorithm' in b.config) || b.config['ssl.endpoint.identification.algorithm'] == 'https' || b.config['ssl.endpoint.identification.algorithm'] == ''))"
    message: "Hostname verification not enabled — vulnerable to MITM"
    remediation: "Set ssl.endpoint.identification.algorithm=https"
    compliance: {pci_dss: ["4.1"], nist: ["SC-17"], cwe: ["295", "297"]}

  - id: KAFKA-ENC-009
    title: "Certificate revocation checking enabled"
    severity: medium
    category: security
    description: "Enable CRL/OCSP checking via JVM properties"
    condition: "true"
    message: "CRL/OCSP checking should be enabled via JVM: -Dcom.sun.net.ssl.checkRevocation=true"
    remediation: "Add -Dcom.sun.net.ssl.checkRevocation=true -Dcom.sun.security.enableCRLDP=true"
    compliance: {pci_dss: ["4.1"], nist: ["SC-17", "IA-5"], cwe: ["295", "297"]}

  - id: KAFKA-ENC-010
    title: "Dynamic SSL reconfiguration enabled"
    severity: low
    category: security
    description: "Use dynamic broker configuration (Kafka 2.5+) for zero-downtime cert rotation"
    condition: "true"
    message: "Dynamic SSL config enables zero-downtime certificate rotation"
    remediation: "Use kafka-configs.sh --alter for dynamic SSL updates (Kafka 2.5+)"
    compliance: {pci_dss: ["3.6"], nist: ["SC-12", "CM-3"], cwe: ["324"]}

  # ═══════════════ AUTHORIZATION / ACLs (15) ═══════════════
  - id: KAFKA-ACL-001
    title: "Topic read ACLs configured"
    severity: high
    category: security
    description: "Restrict topic read access with explicit ACLs"
    condition: "acls.size() > 0"
    message: "No ACLs configured — all users can read all topics"
    remediation: "Use kafka-acls.sh --operation Read to restrict topic read access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-ACL-002
    title: "Topic write ACLs configured"
    severity: high
    category: security
    description: "Restrict topic write access with explicit ACLs"
    condition: "acls.filter(a, a.operation == 'WRITE').size() > 0"
    message: "No write ACLs configured — unauthorized data injection possible"
    remediation: "Use kafka-acls.sh --operation Write to restrict topic write access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-ACL-003
    title: "Topic create/delete restricted"
    severity: high
    category: security
    description: "Restrict topic creation and deletion to administrators"
    condition: "true"
    message: "Verify topic create/delete is restricted via ACLs or config (delete.topic.enable=false)"
    remediation: "Set ACLs for Create/Delete operations and delete.topic.enable=false"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863", "269"]}

  - id: KAFKA-ACL-004
    title: "Consumer group ACLs configured"
    severity: medium
    category: security
    description: "Restrict consumer group access with explicit ACLs"
    condition: "acls.filter(a, a.resource_type == 'GROUP').size() > 0"
    message: "No consumer group ACLs — any consumer can join any group"
    remediation: "Use kafka-acls.sh --group to restrict consumer group access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862"]}

  - id: KAFKA-ACL-005
    title: "Cluster operations restricted"
    severity: high
    category: security
    description: "Restrict cluster-level operations (AlterConfigs, DescribeConfigs) to admins"
    condition: "acls.filter(a, a.resource_type == 'CLUSTER').size() > 0"
    message: "No cluster-level ACLs — any user can modify broker configs"
    remediation: "Use kafka-acls.sh --cluster to restrict cluster operations"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "269"]}

  - id: KAFKA-ACL-006
    title: "Default deny policy configured"
    severity: critical
    category: security
    description: "Set allow.everyone.if.no.acl.found=false"
    condition: "brokers.all(b, 'config' in b && 'allow.everyone.if.no.acl.found' in b.config && b.config['allow.everyone.if.no.acl.found'] == 'false')"
    message: "Default allow policy — unauthenticated users can access resources"
    remediation: "Set allow.everyone.if.no.acl.found=false"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-007
    title: "Prefix-based ACLs for scalable management"
    severity: low
    category: security
    description: "Use prefixed resource patterns for scalable ACL management"
    condition: "true"
    message: "Consider using prefixed ACLs (e.g. 'myapp-*') for topic groups"
    remediation: "Define prefixed ACL patterns like 'myapp-*' for topic groups"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-ACL-008
    title: "Transactional ID ACLs configured"
    severity: medium
    category: security
    description: "Restrict transactional ID access with ACLs"
    condition: "true"
    message: "Verify transactional ID ACLs if using transactions"
    remediation: "Use kafka-acls.sh --transactional-id to restrict transaction IDs"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "639"]}

  - id: KAFKA-ACL-009
    title: "Idempotent producer ACLs configured"
    severity: medium
    category: security
    description: "Configure ACLs for idempotent producers"
    condition: "true"
    message: "If using idempotent producers, verify IdempotentWrite ACLs"
    remediation: "Set IdempotentWrite ACLs for idempotent producer applications"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862"]}

  - id: KAFKA-ACL-010
    title: "Authorizer class configured"
    severity: critical
    category: security
    description: "Enable ACL authorizer: AclAuthorizer (ZK) or StandardAuthorizer (KRaft)"
    condition: "brokers.all(b, 'config' in b && 'authorizer.class.name' in b.config)"
    message: "No authorizer configured — ACLs are not enforced"
    remediation: "Set authorizer.class.name=kafka.security.authorizer.AclAuthorizer (ZK) or StandardAuthorizer (KRaft)"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-011
    title: "Super users configured for break-glass"
    severity: medium
    category: security
    description: "Define super.users for break-glass administration"
    condition: "brokers.all(b, 'config' in b && 'super.users' in b.config && b.config['super.users'] != '')"
    message: "Super users not configured — no break-glass admin access"
    remediation: "Define super.users with restricted membership for emergency access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-6"], cwe: ["269", "862"]}

  - id: KAFKA-ACL-012
    title: "Internal topic ACLs applied"
    severity: high
    category: security
    description: "Apply ACLs to internal topics (__consumer_offsets, __transaction_state, _schemas)"
    condition: "acls.filter(a, a.resource_name.startsWith('__') || a.resource_name.startsWith('_')).size() > 0"
    message: "No ACLs on internal topics — metadata accessible to all"
    remediation: "Add ACLs for __consumer_offsets, __transaction_state, _schemas topics"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-013
    title: "No wildcard ACLs in production"
    severity: high
    category: security
    description: "Avoid wildcard (*) ACLs in production"
    condition: "acls.filter(a, a.principal == '*' || a.host == '*').size() == 0"
    message: "Wildcard ACLs grant unrestricted access to all principals or hosts"
    remediation: "Replace wildcard ACLs with explicit or prefixed resource patterns"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-014
    title: "Periodic ACL review"
    severity: low
    category: security
    description: "Review ACLs periodically to remove unused permissions"
    condition: "true"
    message: "Schedule periodic ACL reviews (quarterly) to validate least-privilege access"
    remediation: "Audit ACLs every quarter and remove unused permissions"
    compliance: {pci_dss: ["7.1"], nist: ["AC-2", "AC-6"], cwe: ["862", "269"]}

  - id: KAFKA-ACL-015
    title: "RBAC/ABAC via external authorizer"
    severity: low
    category: security
    description: "Implement RBAC/ABAC policies via external authorizers for attribute-based access"
    condition: "true"
    message: "Consider external authorizer (OPA, Open Policy Agent) for RBAC/ABAC"
    remediation: "Integrate OPA or custom authorizer for attribute-based access control"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  # ═══════════════ AUDIT LOGGING (10) ═══════════════
  - id: KAFKA-AUDIT-001
    title: "Authorization audit logging enabled"
    severity: high
    category: security
    description: "Enable authorizer logging to track ACL decisions"
    condition: "true"
    message: "Configure log4j.logger.kafka.authorizer.logger=INFO to capture ACL decisions"
    remediation: "Set log4j.logger.kafka.authorizer.logger=INFO in log4j.properties"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-002
    title: "Authentication audit logging"
    severity: high
    category: security
    description: "Log authentication successes and failures"
    condition: "true"
    message: "Authentication audit logging should capture SASL success/failure events"
    remediation: "Enable DEBUG logging for org.apache.kafka.common.security"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-003
    title: "Request logging for client operations"
    severity: medium
    category: security
    description: "Enable request logging to track client operations"
    condition: "true"
    message: "Enable kafka.request.logger to capture produce/consume/subscribe actions"
    remediation: "Configure kafka.request.logger in log4j.properties"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-004
    title: "Audit log retention configured"
    severity: medium
    category: security
    description: "Configure log retention for audit compliance with restricted permissions"
    condition: "true"
    message: "Configure Log4j log retention and protect audit logs with restricted permissions"
    remediation: "Set log retention >= 90 days, restrict file permissions, forward to centralized logging"
    compliance: {pci_dss: ["10.5"], nist: ["AU-4", "AU-9", "AU-11"], cwe: ["778"]}

  - id: KAFKA-AUDIT-005
    title: "ACL and config change audit"
    severity: high
    category: security
    description: "Log and review ACL changes and dynamic config updates"
    condition: "true"
    message: "ACL changes and AlterConfigs operations must be logged and forwarded to SIEM"
    remediation: "Capture AlterConfigs and ACL change events, forward to SIEM/Splunk"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-006
    title: "Log integrity and SIEM forwarding"
    severity: high
    category: security
    description: "Forward audit logs to centralized storage with integrity protection"
    condition: "true"
    message: "Audit logs should be forwarded to SIEM (Splunk/ELK) with WORM storage"
    remediation: "Forward logs to centralized SIEM, protect with WORM storage or restricted access"
    compliance: {pci_dss: ["10.5"], nist: ["AU-4", "AU-9"], cwe: ["778"]}

  - id: KAFKA-AUDIT-007
    title: "Schema Registry change audit [ecosystem]"
    severity: medium
    category: security
    description: "Audit schema registrations, compatibility changes, and deletions"
    condition: "true"
    message: "Schema Registry audit requires Schema Registry collector"
    remediation: "Enable Schema Registry audit logging"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-008
    title: "Connect connector change audit [ecosystem]"
    severity: medium
    category: security
    description: "Audit Connect connector create/update/pause/delete operations"
    condition: "true"
    message: "Connect audit requires Connect collector"
    remediation: "Enable Kafka Connect audit logging"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-009
    title: "Consumer group offset change audit"
    severity: medium
    category: security
    description: "Audit consumer group offset resets and membership changes"
    condition: "true"
    message: "Consumer group offset changes should be audited"
    remediation: "Log OffsetCommit and JoinGroup/LeaveGroup events"
