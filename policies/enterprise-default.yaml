# kafka-security-scanner policy — enterprise-default (118 controls)
# Sourced from https://github.com/conduktor/kafka-security-controls — that repo
# is the canonical home for the regulatory mappings (CWE, NIST 800-53,
# PCI-DSS 4.0, SOC2, ISO 27001). This file is the executable CEL projection.
# CEL conditions evaluated by cel-java.
# Controls requiring Connect/Schema Registry/REST/MM2/Streams collectors are marked [ecosystem].

name: enterprise-default
version: "3.0.0"
description: "Full compliance policy: 118 controls mapped to PCI-DSS 4.0, SOC 2, ISO 27001, NIST 800-53, CIS"
framework: "PCI-DSS 4.0, SOC 2 Type II, ISO/IEC 27001, NIST 800-53"

controls:
  # ═══════════════ AUTHENTICATION (14) ═══════════════
  - &KAFKA-AUTH-001
    id: KAFKA-AUTH-001
    title: "SASL/SCRAM configured for client authentication"
    severity: high
    category: security
    description: "Enable SASL/SCRAM-SHA-256 or SASL/SCRAM-SHA-512 for client authentication"
    condition: "brokers.all(b, 'sasl' in b && b.sasl.enabled && b.sasl.mechanisms.exists(m, m in ['SCRAM-SHA-256', 'SCRAM-SHA-512']))"
    message: "SASL/SCRAM is not configured — clients can connect without authentication"
    remediation: "Configure sasl.mechanism and sasl.jaas.config on brokers and clients"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-004
    title: "SASL/PLAIN must be paired with TLS"
    severity: high
    category: security
    description: "SASL/PLAIN must only be used with TLS (SASL_SSL protocol). Prefer SCRAM-SHA-256/512"
    condition: "brokers.all(b, !('config' in b && 'sasl.enabled.mechanisms' in b.config && b.config['sasl.enabled.mechanisms'].contains('PLAIN')) || !b.config['listener.security.protocol.map'].contains(':SASL_PLAINTEXT'))"
    message: "SASL/PLAIN used without TLS — credentials sent in cleartext"
    remediation: "Use SASL_SSL protocol or switch to SCRAM-SHA-512"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "SC-8"], cwe: ["319", "522"]}

  - id: KAFKA-AUTH-005
    title: "mTLS client certificate authentication"
    severity: high
    category: security
    description: "Implement mutual TLS where clients present certificates signed by a trusted CA"
    condition: "brokers.all(b, 'config' in b && 'ssl.client.auth' in b.config && b.config['ssl.client.auth'] == 'required')"
    message: "mTLS not configured — client certificate auth provides strongest identity verification"
    remediation: "Configure ssl.client.auth=required on brokers"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5", "SC-17"], cwe: ["287", "295", "297"]}

  - id: KAFKA-AUTH-006
    title: "SCRAM credential rotation configured"
    severity: medium
    category: security
    description: "Implement regular rotation of SCRAM credentials"
    requires: [docs]
    condition: "brokers.all(b, 'config' in b && 'sasl.enabled.mechanisms' in b.config && (b.config['sasl.enabled.mechanisms'].contains('SCRAM-SHA-256') || b.config['sasl.enabled.mechanisms'].contains('SCRAM-SHA-512'))) && docs.key_rotation_log.exists && docs.key_rotation_log.age_days >= 0 && docs.key_rotation_log.age_days <= 90"
    message: "SCRAM credentials should be rotated regularly — document rotation procedure"
    remediation: "Rotate SCRAM credentials via kafka-configs.sh every 90 days; record each rotation in docs/key-rotation-log.md"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5"], cwe: ["798", "522"]}

  - id: KAFKA-AUTH-007
    title: "Certificate rotation before expiry"
    severity: high
    category: security
    description: "Implement automated certificate rotation before expiry. Kafka 2.5+ supports dynamic keystore updates"
    requires: [tls, docs]
    condition: "tls.handshake_ok && tls.days_to_expiry > 30 && docs.key_rotation_log.exists && docs.key_rotation_log.age_days >= 0 && docs.key_rotation_log.age_days <= 365"
    message: "Ensure certificate rotation is automated — expired certs cause outages"
    remediation: "Use short-lived certificates and automate rotation. Kafka 2.5+ supports dynamic SSL updates; record each rotation in docs/key-rotation-log.md"
    compliance: {pci_dss: ["4.1"], nist: ["IA-5", "SC-12"], cwe: ["324"]}

  - id: KAFKA-AUTH-008
    title: "SASL for inter-broker communication"
    severity: high
    category: security
    description: "Configure SASL for inter-broker communication"
    condition: "brokers.all(b, 'config' in b && 'security.inter.broker.protocol' in b.config && (b.config['security.inter.broker.protocol'] == 'SASL_SSL' || b.config['security.inter.broker.protocol'] == 'SASL_PLAINTEXT'))"
    message: "Inter-broker SASL not configured"
    remediation: "Set security.inter.broker.protocol=SASL_SSL and sasl.mechanism.inter.broker.protocol"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-009
    title: "SASL mechanism allowlist configured"
    severity: medium
    category: security
    description: "Restrict enabled SASL mechanisms to only required ones"
    condition: "brokers.all(b, 'config' in b && 'sasl.enabled.mechanisms' in b.config && (b.config['sasl.enabled.mechanisms'].contains('SCRAM-SHA-256') || b.config['sasl.enabled.mechanisms'].contains('SCRAM-SHA-512') || b.config['sasl.enabled.mechanisms'].contains('GSSAPI') || b.config['sasl.enabled.mechanisms'].contains('OAUTHBEARER')) && !b.config['sasl.enabled.mechanisms'].contains('PLAIN') && !b.config['sasl.enabled.mechanisms'].contains('CRAM-MD5') && !b.config['sasl.enabled.mechanisms'].contains('DIGEST-MD5'))"
    message: "SASL mechanism allowlist not explicitly configured"
    remediation: "Set sasl.enabled.mechanisms to only required mechanisms (e.g. SCRAM-SHA-512)"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-010
    title: "SSL principal mapping rules configured"
    severity: medium
    category: security
    description: "Configure ssl.principal.mapping.rules to map certificate DNs to canonical principals"
    condition: "brokers.all(b, 'config' in b && 'ssl.principal.mapping.rules' in b.config && b.config['ssl.principal.mapping.rules'].size() > 0)"
    message: "SSL principal mapping rules should be configured for mTLS environments"
    remediation: "Set ssl.principal.mapping.rules to prevent ambiguous identity mapping"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2"], cwe: ["287", "295"]}

  - id: KAFKA-AUTH-011
    title: "OAuth token lifetime enforcement"
    severity: medium
    category: security
    description: "Use short-lived OAuth/OIDC tokens for SASL/OAUTHBEARER"
    condition: "brokers.all(b, !('config' in b && 'sasl.enabled.mechanisms' in b.config && b.config['sasl.enabled.mechanisms'].contains('OAUTHBEARER')) || ('connections.max.reauth.ms' in b.config && b.config['connections.max.reauth.ms'].size() > 0 && b.config['connections.max.reauth.ms'] != '0' && b.config['connections.max.reauth.ms'] != '-1'))"
    message: "If using OAuth, ensure short-lived tokens with audience/issuer validation"
    remediation: "Configure token lifetime < 1 hour and validate issuer/audience"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "IA-8"], cwe: ["287", "522"]}

  - id: KAFKA-AUTH-012
    title: "Per-tenant principals configured"
    severity: medium
    category: security
    description: "Use unique principals and client IDs per application or tenant"
    condition: "acl_meta.collected && acl_meta.distinct_principal_count >= 2 && !acls.exists(a, a.principal == 'User:*' || a.principal == 'User:ANONYMOUS' || a.principal == '*')"
    message: "Ensure unique principals per application for audit and quota isolation"
    remediation: "Assign unique service accounts per application/tenant"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-AUTH-013
    title: "Delegation tokens for long-running apps"
    severity: medium
    category: security
    description: "Use delegation tokens for Kafka Streams, Spark, Flink to avoid storing credentials"
    condition: "brokers.all(b, 'config' in b && 'delegation.token.secret.key' in b.config && b.config['delegation.token.secret.key'].size() > 0) && acls.exists(a, a.resource_type == 'DELEGATION_TOKEN')"
    message: "Delegation tokens should be used for long-running stream processors"
    remediation: "Configure delegation.token.master.key and use kafka-delegation-tokens.sh"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "IA-2"], cwe: ["287", "522"]}

  - id: KAFKA-AUTH-014
    title: "Connection re-authentication enforced"
    severity: medium
    category: security
    description: "Force periodic re-authentication using connections.max.reauth.ms"
    condition: "brokers.all(b, 'config' in b && 'connections.max.reauth.ms' in b.config && b.config['connections.max.reauth.ms'].size() > 0 && b.config['connections.max.reauth.ms'] != '0' && b.config['connections.max.reauth.ms'] != '-1')"
    message: "Connection re-authentication not configured — compromised credentials persist"
    remediation: "Set connections.max.reauth.ms to enforce periodic re-auth (Kafka 2.2+)"
    compliance: {pci_dss: ["8.2"], nist: ["IA-5", "IA-11"], cwe: ["287", "613"]}

  # ═══════════════ ENCRYPTION (11) ═══════════════
  - id: KAFKA-ENC-001
    title: "Inter-broker TLS encryption enabled"
    severity: critical
    category: security
    description: "Enable TLS encryption between brokers"
    condition: "brokers.all(b, 'config' in b && 'security.inter.broker.protocol' in b.config && b.config['security.inter.broker.protocol'] in ['SSL', 'SASL_SSL'])"
    message: "Inter-broker communication is not encrypted — replication traffic exposed"
    remediation: "Set security.inter.broker.protocol=SSL or SASL_SSL"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-ENC-002
    title: "Client-broker TLS encryption enabled"
    severity: critical
    category: security
    description: "All client-facing listeners must use SSL or SASL_SSL protocol"
    condition: "brokers.all(b, 'config' in b && 'listener.security.protocol.map' in b.config && !b.config['listener.security.protocol.map'].matches('(?i).*[A-Z0-9_-]+:PLAINTEXT($|,).*'))"
    message: "One or more client listeners use PLAINTEXT — data exposed in transit"
    remediation: "Configure listeners with SSL:// or SASL_SSL:// protocol"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-ENC-003
    title: "ZooKeeper TLS enabled"
    severity: high
    category: security
    description: "Enable TLS for broker-to-ZooKeeper communication"
    condition: "cluster.mode == 'kraft' || (cluster.mode == 'zookeeper' && brokers.all(b, 'config' in b && 'zookeeper.ssl.client.enable' in b.config && b.config['zookeeper.ssl.client.enable'] == 'true'))"
    message: "ZooKeeper communication is not encrypted"
    remediation: "Set zookeeper.ssl.client.enable=true"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-ENC-004
    title: "Disk encryption for log directories (dm-crypt/LUKS or ZFS native)"
    severity: high
    category: security
    description: "Walk /proc/mounts on the broker host: every log.dirs entry must resolve to a /dev/mapper/* device, a crypto_LUKS fstype, or an encrypted ZFS dataset. Self-hosted on macOS / non-Linux falls back to docs evidence — every cloud flavor now has a dedicated cloud-native control."
    requires: [filesystem]
    condition: "fs.log_dirs_proc_mounts_readable && fs.log_dirs_encrypted"
    message: "A Kafka log.dirs path is on a non-encrypted device (no /dev/mapper/, no crypto_LUKS, no ZFS)"
    remediation: "Move log.dirs onto a dm-crypt / LUKS / ZFS-encrypted volume; restart the broker so the new mount is in /proc/mounts"
    compliance: {pci_dss: ["3.4"], nist: ["SC-28"], cwe: ["311", "312"]}

  - id: KAFKA-ENC-005
    title: "TLS protocol version >= 1.2 enforced"
    severity: high
    category: security
    description: "Enforce TLS 1.2 or 1.3 minimum. Disable SSLv3, TLS 1.0, 1.1"
    condition: "brokers.all(b, 'config' in b && 'ssl.enabled.protocols' in b.config && (b.config['ssl.enabled.protocols'].contains('TLSv1.2') || b.config['ssl.enabled.protocols'].contains('TLSv1.3')) && !b.config['ssl.enabled.protocols'].contains('TLSv1.0') && !b.config['ssl.enabled.protocols'].contains('TLSv1.1'))"
    message: "Older TLS versions (1.0/1.1) may be enabled — vulnerable to POODLE/BEAST"
    remediation: "Set ssl.enabled.protocols=TLSv1.2,TLSv1.3"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["326", "327"]}

  - id: KAFKA-ENC-006
    title: "Strong cipher suites configured"
    severity: medium
    category: security
    description: "Configure strong AEAD cipher suites (GCM, ChaCha20-Poly1305)"
    condition: "brokers.all(b, 'config' in b && 'ssl.cipher.suites' in b.config && b.config['ssl.cipher.suites'].size() > 0 && (b.config['ssl.cipher.suites'].contains('GCM') || b.config['ssl.cipher.suites'].contains('CHACHA20_POLY1305') || b.config['ssl.cipher.suites'].contains('CHACHA20-POLY1305')) && !b.config['ssl.cipher.suites'].contains('RC4') && !b.config['ssl.cipher.suites'].contains('3DES') && !b.config['ssl.cipher.suites'].contains('NULL') && !b.config['ssl.cipher.suites'].contains('MD5') && !b.config['ssl.cipher.suites'].contains('EXPORT') && !b.config['ssl.cipher.suites'].contains('DES-CBC'))"
    message: "Cipher suites not explicitly configured — may use weak defaults"
    remediation: "Set ssl.cipher.suites to TLS_AES_256_GCM_SHA384 and other AEAD ciphers"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["326", "327"]}

  - id: KAFKA-ENC-007
    title: "CA certificate validation configured"
    severity: high
    category: security
    description: "Configure ssl.truststore with trusted CA certificates"
    requires: [tls]
    condition: "brokers.all(b, 'config' in b && 'ssl.truststore.location' in b.config && b.config['ssl.truststore.location'].size() > 0) && 'handshake_ok' in tls && tls.handshake_ok"
    message: "Truststore not configured — certificates not validated"
    remediation: "Set ssl.truststore.location and ssl.truststore.password"
    compliance: {pci_dss: ["4.1"], nist: ["SC-17", "SC-12"], cwe: ["295", "296", "297"]}

  - id: KAFKA-ENC-008
    title: "Hostname verification enabled"
    severity: medium
    category: security
    description: "Enable ssl.endpoint.identification.algorithm=https"
    condition: "brokers.all(b, 'config' in b && 'ssl.endpoint.identification.algorithm' in b.config && b.config['ssl.endpoint.identification.algorithm'] == 'https') && (!('handshake_ok' in tls) || tls.plaintext_endpoint || !tls.handshake_ok || ('hostname_match' in tls && tls.hostname_match))"
    message: "Hostname verification not enabled — vulnerable to MITM"
    remediation: "Set ssl.endpoint.identification.algorithm=https"
    compliance: {pci_dss: ["4.1"], nist: ["SC-17"], cwe: ["295", "297"]}

  - id: KAFKA-ENC-009
    title: "Certificate revocation checking enabled"
    severity: medium
    category: security
    description: "Enable CRL/OCSP checking via JVM properties"
    requires: [process]
    condition: "'cmdline' in process && process.cmdline.contains('-Dcom.sun.net.ssl.checkRevocation=true') && process.cmdline.contains('-Dcom.sun.security.enableCRLDP=true')"
    message: "CRL/OCSP checking should be enabled via JVM: -Dcom.sun.net.ssl.checkRevocation=true"
    remediation: "Add -Dcom.sun.net.ssl.checkRevocation=true -Dcom.sun.security.enableCRLDP=true"
    compliance: {pci_dss: ["4.1"], nist: ["SC-17", "IA-5"], cwe: ["295", "297"]}

  - id: KAFKA-ENC-010
    title: "Dynamic SSL reconfiguration enabled"
    severity: low
    category: security
    description: "Use dynamic broker configuration (Kafka 2.5+) for zero-downtime cert rotation"
    requires: [process]
    condition: "'kafka_version_major' in process && (process.kafka_version_major >= 3 || (process.kafka_version_major == 2 && process.kafka_version_minor >= 5))"
    message: "Dynamic SSL config enables zero-downtime certificate rotation"
    remediation: "Use kafka-configs.sh --alter for dynamic SSL updates (Kafka 2.5+)"
    compliance: {pci_dss: ["3.6"], nist: ["SC-12", "CM-3"], cwe: ["324"]}

  # ═══════════════ AUTHORIZATION / ACLs (15) ═══════════════
  - id: KAFKA-ACL-001
    title: "Topic read ACLs configured"
    severity: high
    category: security
    description: "Restrict topic read access with explicit ACLs"
    condition: "acl_meta.collected && acls.exists(a, a.resource_type == 'TOPIC' && a.operation == 'READ' && a.permission_type == 'ALLOW')"
    message: "No ACLs configured — all users can read all topics"
    remediation: "Use kafka-acls.sh --operation Read to restrict topic read access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-ACL-002
    title: "Topic write ACLs configured"
    severity: high
    category: security
    description: "Restrict topic write access with explicit ACLs"
    condition: "acl_meta.collected && acls.exists(a, a.resource_type == 'TOPIC' && a.operation == 'WRITE' && a.permission_type == 'ALLOW')"
    message: "No write ACLs configured — unauthorized data injection possible"
    remediation: "Use kafka-acls.sh --operation Write to restrict topic write access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-ACL-003
    title: "Topic create/delete restricted to admin allowlist"
    severity: high
    category: security
    description: "Restrict topic creation and deletion to the principals enumerated in docs/admin-principals.md"
    requires: [adminclient, docs]
    condition: "acl_meta.collected && docs.admin_principals.exists && size(docs.admin_principals.principals) > 0 && acls.exists(a, a.resource_type == 'CLUSTER' && a.permission_type == 'ALLOW' && (a.operation == 'CREATE' || a.operation == 'ALTER' || a.operation == 'DELETE')) && acls.all(a, !(a.resource_type == 'CLUSTER' && a.permission_type == 'ALLOW' && (a.operation == 'CREATE' || a.operation == 'DELETE')) || a.principal in docs.admin_principals.principals)"
    message: "Cluster CREATE/DELETE ACL grants a principal not listed in docs/admin-principals.md"
    remediation: "Reconcile broker ACLs with docs/admin-principals.md; remove any CREATE/DELETE ALLOW for principals not on the allowlist"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863", "269"]}

  - id: KAFKA-ACL-004
    title: "Consumer group ACLs configured"
    severity: medium
    category: security
    description: "Restrict consumer group access with explicit ACLs"
    condition: "acl_meta.collected && acls.exists(a, a.resource_type == 'GROUP' && a.operation == 'READ' && a.permission_type == 'ALLOW')"
    message: "No consumer group ACLs — any consumer can join any group"
    remediation: "Use kafka-acls.sh --group to restrict consumer group access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862"]}

  - id: KAFKA-ACL-005
    title: "Cluster operations restricted to admin allowlist"
    severity: high
    category: security
    description: "All cluster-level ALLOW grants for ALTER/CREATE/DESCRIBE_CONFIGS/ALTER_CONFIGS must target principals listed in docs/admin-principals.md"
    requires: [adminclient, docs]
    condition: "acl_meta.collected && docs.admin_principals.exists && size(docs.admin_principals.principals) > 0 && acls.exists(a, a.resource_type == 'CLUSTER' && a.permission_type == 'ALLOW' && (a.operation == 'ALTER' || a.operation == 'CREATE' || a.operation == 'DESCRIBE_CONFIGS' || a.operation == 'ALTER_CONFIGS')) && acls.all(a, !(a.resource_type == 'CLUSTER' && a.permission_type == 'ALLOW' && (a.operation == 'ALTER' || a.operation == 'CREATE' || a.operation == 'DESCRIBE_CONFIGS' || a.operation == 'ALTER_CONFIGS')) || a.principal in docs.admin_principals.principals)"
    message: "A cluster-level ALLOW ACL targets a principal not listed in docs/admin-principals.md"
    remediation: "Limit cluster ALTER/CREATE/DESCRIBE_CONFIGS/ALTER_CONFIGS to the principals in docs/admin-principals.md"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "269"]}

  - id: KAFKA-ACL-006
    title: "Default deny policy configured"
    severity: critical
    category: security
    description: "Set allow.everyone.if.no.acl.found=false"
    condition: "acl_meta.collected && brokers.all(b, 'config' in b && 'allow.everyone.if.no.acl.found' in b.config && b.config['allow.everyone.if.no.acl.found'] == 'false') && brokers.all(b, 'config' in b && 'authorizer.class.name' in b.config && b.config['authorizer.class.name'].size() > 0)"
    message: "Default allow policy — unauthenticated users can access resources"
    remediation: "Set allow.everyone.if.no.acl.found=false"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-007
    title: "Prefix-based ACLs for scalable management"
    severity: low
    category: security
    description: "Use prefixed resource patterns for scalable ACL management"
    condition: "acl_meta.collected && acls.exists(a, a.pattern_type == 'PREFIXED')"
    message: "Consider using prefixed ACLs (e.g. 'myapp-*') for topic groups"
    remediation: "Define prefixed ACL patterns like 'myapp-*' for topic groups"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-ACL-008
    title: "Transactional ID ACLs configured"
    severity: medium
    category: security
    description: "Restrict transactional ID access with ACLs"
    condition: "acl_meta.collected && acls.exists(a, a.resource_type == 'TRANSACTIONAL_ID')"
    message: "Verify transactional ID ACLs if using transactions"
    remediation: "Use kafka-acls.sh --transactional-id to restrict transaction IDs"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "639"]}

  - id: KAFKA-ACL-009
    title: "Idempotent producer ACLs configured"
    severity: medium
    category: security
    description: "Configure ACLs for idempotent producers"
    condition: "acl_meta.collected && acls.exists(a, a.resource_type == 'CLUSTER' && a.operation == 'IDEMPOTENT_WRITE' && a.permission_type == 'ALLOW')"
    message: "If using idempotent producers, verify IdempotentWrite ACLs"
    remediation: "Set IdempotentWrite ACLs for idempotent producer applications"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862"]}

  - id: KAFKA-ACL-010
    title: "Authorizer class configured"
    severity: critical
    category: security
    description: "Enable ACL authorizer: AclAuthorizer (ZK) or StandardAuthorizer (KRaft)"
    condition: "brokers.all(b, 'config' in b && 'authorizer.class.name' in b.config)"
    message: "No authorizer configured — ACLs are not enforced"
    remediation: "Set authorizer.class.name=kafka.security.authorizer.AclAuthorizer (ZK) or StandardAuthorizer (KRaft)"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-011
    title: "Super users configured for break-glass"
    severity: medium
    category: security
    description: "Define super.users for break-glass administration"
    condition: "brokers.all(b, 'config' in b && 'super.users' in b.config && b.config['super.users'] != '')"
    message: "Super users not configured — no break-glass admin access"
    remediation: "Define super.users with restricted membership for emergency access"
    compliance: {pci_dss: ["7.1"], nist: ["AC-6"], cwe: ["269", "862"]}

  - id: KAFKA-ACL-012
    title: "Internal topic ACLs applied"
    severity: high
    category: security
    description: "Apply ACLs to internal topics (__consumer_offsets, __transaction_state, _schemas)"
    condition: "topic_meta.collected && acl_meta.collected && topics.filter(t, t.internal).all(t, acls.exists(a, a.resource_type == 'TOPIC' && a.permission_type == 'ALLOW' && (a.operation == 'READ' || a.operation == 'WRITE' || a.operation == 'DESCRIBE') && (a.resource_name == t.name || (a.pattern_type == 'PREFIXED' && t.name.startsWith(a.resource_name)))))"
    message: "No ACLs on internal topics — metadata accessible to all"
    remediation: "Add ACLs for __consumer_offsets, __transaction_state, _schemas topics"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-013
    title: "No wildcard ACLs in production"
    severity: high
    category: security
    description: "Avoid wildcard (*) ACLs in production"
    condition: "acl_meta.collected && acls.filter(a, a.principal == 'User:*' || a.principal == '*' || a.host == '*' || a.resource_name == '*').size() == 0"
    message: "Wildcard ACLs grant unrestricted access to all principals or hosts"
    remediation: "Replace wildcard ACLs with explicit or prefixed resource patterns"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  - id: KAFKA-ACL-014
    title: "Periodic ACL review"
    severity: low
    category: security
    description: "Review ACLs periodically to remove unused permissions"
    requires: [docs]
    condition: "docs.acl_review_log.exists && docs.acl_review_log.age_days <= 90"
    message: "Schedule periodic ACL reviews (quarterly) to validate least-privilege access"
    remediation: "Audit ACLs every quarter and remove unused permissions"
    compliance: {pci_dss: ["7.1"], nist: ["AC-2", "AC-6"], cwe: ["862", "269"]}

  - id: KAFKA-ACL-015
    title: "RBAC/ABAC via external authorizer"
    severity: low
    category: security
    description: "Implement RBAC/ABAC policies via external authorizers for attribute-based access"
    requires: [docs]
    condition: "brokers.all(b, 'config' in b && 'authorizer.class.name' in b.config && b.config['authorizer.class.name'].size() > 0 && b.config['authorizer.class.name'] != 'kafka.security.authorizer.AclAuthorizer' && b.config['authorizer.class.name'] != 'org.apache.kafka.metadata.authorizer.StandardAuthorizer') && docs.rbac_policy.exists"
    message: "Consider external authorizer (OPA, Open Policy Agent) for RBAC/ABAC"
    remediation: "Integrate OPA or custom authorizer for attribute-based access control"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "284"]}

  # ═══════════════ AUDIT LOGGING (10) ═══════════════
  - id: KAFKA-AUDIT-001
    title: "Authorization audit logging enabled"
    severity: high
    category: security
    description: "Enable authorizer logging to track ACL decisions"
    requires: [filesystem]
    condition: "brokers.all(b, 'config' in b && 'authorizer.class.name' in b.config && b.config['authorizer.class.name'].size() > 0) && (!('files' in fs) || fs.audit_logger_configured)"
    message: "Configure log4j.logger.kafka.authorizer.logger=INFO to capture ACL decisions"
    remediation: "Set log4j.logger.kafka.authorizer.logger=INFO in log4j.properties"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-002
    title: "Authentication audit logging"
    severity: high
    category: security
    description: "Log authentication successes and failures"
    requires: [filesystem]
    condition: "!('files' in fs) || fs.auth_logger_configured"
    message: "Authentication audit logging should capture SASL success/failure events"
    remediation: "Enable DEBUG logging for org.apache.kafka.common.security"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-003
    title: "Request logging for client operations"
    severity: medium
    category: security
    description: "Enable request logging to track client operations"
    requires: [filesystem]
    condition: "!('files' in fs) || fs.request_logger_configured"
    message: "Enable kafka.request.logger to capture produce/consume/subscribe actions"
    remediation: "Configure kafka.request.logger in log4j.properties"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-004
    title: "Audit log retention configured"
    severity: medium
    category: security
    description: "Configure log retention for audit compliance with restricted permissions"
    requires: [filesystem]
    condition: "'files' in fs && fs.audit_logger_configured && !fs.any_log_file_world_readable && fs.audit_log_retention_configured"
    message: "Configure Log4j log retention and protect audit logs with restricted permissions"
    remediation: "Set log retention >= 90 days, restrict file permissions, forward to centralized logging"
    compliance: {pci_dss: ["10.5"], nist: ["AU-4", "AU-9", "AU-11"], cwe: ["778"]}

  - id: KAFKA-AUDIT-005
    title: "ACL and config change audit"
    severity: high
    category: security
    description: "Log and review ACL changes and dynamic config updates"
    requires: [filesystem]
    condition: "!('files' in fs) || fs.change_logger_configured"
    message: "ACL changes and AlterConfigs operations must be logged and forwarded to SIEM"
    remediation: "Capture AlterConfigs and ACL change events, forward to SIEM/Splunk"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-006
    title: "SIEM forwarding (live shipper) + broker audit logger"
    severity: high
    category: security
    description: "A log-shipper (vector/fluentd/filebeat/auditbeat/splunkforwarder/...) must be running on the broker host AND broker-side audit logger must be configured"
    requires: [siem, filesystem]
    condition: "siem.detected && 'files' in fs && fs.audit_logger_configured"
    message: "No SIEM shipper detected on broker host or no kafka.authorizer.logger configured — audit trail is not forwarded"
    remediation: "Deploy a SIEM shipper (vector/fluentd/filebeat/splunkforwarder) on every broker; keep kafka.authorizer.logger at INFO+"
    compliance: {pci_dss: ["10.5"], nist: ["AU-4", "AU-9"], cwe: ["778"]}

  - id: KAFKA-AUDIT-007
    title: "Schema Registry change audit (live audit-log topic + auth)"
    severity: medium
    category: security
    description: "SR REST must require auth AND a confluent-audit-log-events topic must exist on the broker to capture schema lifecycle events."
    requires: [schemaregistry, adminclient]
    condition: "schemaregistry.reachable && schemaregistry.all_subjects_require_auth && topic_meta.collected && topic_meta.audit_log_topic_present"
    message: "Schema Registry audit pipeline incomplete: anonymous writes allowed OR no confluent-audit-log-events topic on the cluster"
    remediation: "Enable SR auth (kafka-schema-registry-security-plugin) and provision confluent-audit-log-events on the broker"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-008
    title: "Connect topics enumerated + REST auth + audit pipeline [ecosystem]"
    severity: medium
    category: security
    description: "Connect REST must require auth, every connector must declare its topic set (so audit can attribute writes to a connector), and a SIEM shipper or audit logger must be present"
    requires: [connect]
    condition: "connect.reachable && connect.requires_auth && (size(connect.connectors) == 0 || connect.any_connector_topic_listed)"
    message: "Connect REST is anonymous, or at least one connector does not list its topics — audit cannot attribute writes"
    remediation: "Enable Connect REST auth (basic.auth.user.info / oauth2); ensure every connector config sets `topics` or `topics.regex`"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-009
    title: "Consumer group offset change audit"
    severity: medium
    category: security
    description: "Audit consumer group offset resets and membership changes"
    requires: [filesystem]
    condition: "!('files' in fs) || (fs.request_logger_configured && fs.change_logger_configured)"
    message: "Consumer group offset changes should be audited"
    remediation: "Log OffsetCommit and JoinGroup/LeaveGroup events"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-AUDIT-010
    title: "Data operations audit captures principal + client identity"
    severity: high
    category: security
    description: "Audit / request loggers must be configured AND the log4j PatternLayout must include %X{principal} and %X{clientId}/%X{remoteAddress} so every record identifies who did what from where."
    requires: [filesystem]
    condition: "fs.request_logger_configured && fs.auth_logger_configured && fs.audit_layout_includes_principal && fs.audit_layout_includes_client"
    message: "Audit log layout does not capture principal and/or client identity (clientId / remote address)"
    remediation: "Set the appender layout to include %X{principal} %X{clientId} %X{remoteAddress} (or equivalent MDC keys)"
    compliance: {pci_dss: ["10.2"], nist: ["AU-2", "AU-12"], cwe: ["778", "223"]}

  # ═══════════════ HIGH AVAILABILITY / DR (3) ═══════════════
  - id: KAFKA-AVAIL-001
    title: "Replication factor >= 3, min ISR >= 2"
    severity: high
    category: reliability
    description: "Set replication.factor >= 3 and min.insync.replicas >= 2 on critical topics"
    condition: "topic_meta.collected && topic_meta.count > 0 && topics.all(t, t.replication_factor >= 3 && t.min_insync_replicas >= 2)"
    message: "Replication factor below 3 or min ISR below 2 — data loss risk on broker failure"
    remediation: "Set replication.factor >= 3, min.insync.replicas >= 2, acks=all on producers"
    compliance: {nist: ["CP-2", "CP-10"]}

  - id: KAFKA-AVAIL-002
    title: "Cross-cluster replication (MirrorMaker 2) [ecosystem]"
    severity: medium
    category: reliability
    description: "Implement cross-cluster replication for critical topics"
    requires: [connect]
    condition: "connect.reachable && connect.mm2_connector_present"
    message: "Cross-cluster replication requires MirrorMaker 2 setup"
    remediation: "Deploy MirrorMaker 2 with sync.group.offsets, sync.topic.configs, sync.topic.acls"
    compliance: {nist: ["CP-6", "CP-10"]}

  - id: KAFKA-AVAIL-003
    title: "Failover drills documented"
    severity: low
    category: reliability
    description: "Document RTO/RPO and run periodic failover drills"
    requires: [docs]
    condition: "docs.dr_drill_log.exists && docs.dr_drill_log.age_days <= 90"
    message: "Document and test disaster recovery procedures"
    remediation: "Define RTO/RPO, run quarterly failover drills, verify restore of metadata/schemas/offsets"
    compliance: {nist: ["CP-2", "CP-4", "CP-10"]}

  # ═══════════════ RESOURCE QUOTAS (8) ═══════════════
  - id: KAFKA-QUOTA-001
    title: "Producer byte rate quota configured"
    severity: medium
    category: reliability
    description: "Configure producer_byte_rate quota to prevent resource exhaustion"
    condition: "quota_meta.collected && quotas.exists(q, q.has_producer_byte_rate)"
    message: "Producer byte rate quotas not enforced — malicious producer could exhaust resources"
    remediation: "Set producer_byte_rate quotas via kafka-configs.sh"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770"]}

  - id: KAFKA-QUOTA-002
    title: "Consumer byte rate quota configured"
    severity: medium
    category: reliability
    description: "Configure consumer_byte_rate quota"
    condition: "quota_meta.collected && quotas.exists(q, q.has_consumer_byte_rate)"
    message: "Consumer byte rate quotas prevent denial of service through excessive consumption"
    remediation: "Set consumer_byte_rate quotas via kafka-configs.sh"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770"]}

  - id: KAFKA-QUOTA-003
    title: "Request rate quota configured"
    severity: medium
    category: reliability
    description: "Configure request_percentage quota to limit CPU usage per client"
    condition: "quota_meta.collected && quotas.exists(q, q.has_request_percentage)"
    message: "Request rate quotas prevent CPU exhaustion"
    remediation: "Set request_percentage quotas via kafka-configs.sh"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770"]}

  - id: KAFKA-QUOTA-004
    title: "Max connections per IP capped at < 10000"
    severity: medium
    category: security
    description: "Configure max.connections.per.ip to a finite cap that bounds connection-exhaustion blast radius"
    condition: "brokers.all(b, 'config_int' in b && 'max.connections.per.ip' in b.config_int && b.config_int['max.connections.per.ip'] > 0 && b.config_int['max.connections.per.ip'] < 10000)"
    message: "max.connections.per.ip is unset, zero, or above the 10000 cap — connection-flood DoS surface"
    remediation: "Set max.connections.per.ip to a positive integer below 10000 on every broker"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770", "799"]}

  - id: KAFKA-QUOTA-005
    title: "Broker request and message size limits configured"
    severity: medium
    category: reliability
    description: "Pin socket.request.max.bytes, replica.fetch.max.bytes and message.max.bytes on every broker so producers can't exhaust memory with oversized payloads. (max.request.size lives on the producer; collect it via Connect or client config.)"
    condition: "brokers.all(b, 'config_int' in b && 'socket.request.max.bytes' in b.config_int && b.config_int['socket.request.max.bytes'] > 0 && 'replica.fetch.max.bytes' in b.config_int && b.config_int['replica.fetch.max.bytes'] > 0 && 'message.max.bytes' in b.config_int && b.config_int['message.max.bytes'] > 0)"
    message: "A broker is missing one of socket.request.max.bytes / replica.fetch.max.bytes / message.max.bytes — oversized-payload memory exhaustion surface"
    remediation: "Set socket.request.max.bytes, replica.fetch.max.bytes and message.max.bytes on every broker"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770"]}

  - id: KAFKA-QUOTA-006
    title: "Controller mutation rate quota (KRaft)"
    severity: medium
    category: reliability
    description: "Set controller_mutation_rate quotas in KRaft to limit metadata changes"
    condition: "cluster.mode != 'kraft' || (quota_meta.collected && quotas.exists(q, q.has_controller_mutation_rate))"
    message: "Controller mutation rate quota available in Kafka 3.0+ for KRaft"
    remediation: "Set controller_mutation_rate quota via kafka-configs.sh (Kafka 3.0+)"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770"]}

  - id: KAFKA-QUOTA-007
    title: "Connection creation rate quota"
    severity: medium
    category: reliability
    description: "Configure connection_creation_rate quotas to throttle new connections"
    condition: "quota_meta.collected && quotas.exists(q, q.has_connection_creation_rate)"
    message: "Connection creation rate quotas mitigate connection storms (Kafka 2.8+)"
    remediation: "Set connection_creation_rate quota via kafka-configs.sh (Kafka 2.8+)"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770", "799"]}

  - id: KAFKA-QUOTA-008
    title: "IP-based quotas for unauthenticated clients"
    severity: medium
    category: security
    description: "Apply per-IP quotas for producer/consumer rates"
    condition: "quota_meta.collected && (quotas.exists(q, q.scoped_to_ip) || brokers.all(b, 'config' in b && 'listener.security.protocol.map' in b.config && !b.config['listener.security.protocol.map'].matches('(?i).*[A-Z0-9_-]+:PLAINTEXT($|,).*')))"
    message: "IP-based quotas limit unauthenticated abuse"
    remediation: "Set entity-type ips quotas for producer/consumer rates"
    compliance: {nist: ["SC-5", "SC-6"], cwe: ["770"]}

  # ═══════════════ NETWORK SECURITY (5) ═══════════════
  - id: KAFKA-NET-001
    title: "Listener isolation: at least two distinct protocol classes"
    severity: high
    category: security
    description: "listener.security.protocol.map must define at least two listeners that map to DIFFERENT protocol classes (e.g. INTERNAL:PLAINTEXT + EXTERNAL:SASL_SSL). Two PLAINTEXT entries don't isolate."
    condition: "brokers.all(b, 'listener_protocols_distinct_count' in b && b.listener_protocols_distinct_count >= 2)"
    message: "Broker has ≤1 distinct listener protocol class — internal and external traffic are not isolated"
    remediation: "Define listener.security.protocol.map with separate listeners for internal (e.g. SSL) and external (e.g. SASL_SSL) — two PLAINTEXT entries don't count"
    compliance: {pci_dss: ["1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

  - id: KAFKA-NET-002
    title: "Advertised listeners resolve to private addresses"
    severity: high
    category: security
    description: "Every advertised.listeners host must resolve to a private/loopback/link-local/ULA address (RFC1918 / RFC4193 / 127.0.0.0/8). Public IPs or unresolvable hosts both fail."
    condition: "brokers.all(b, 'advertised_hosts' in b && !b.advertised_hosts_public)"
    message: "An advertised.listeners host resolves to a public IP (or fails to resolve) — clients reach brokers across the open internet"
    remediation: "Set advertised.listeners to DNS names that resolve only to private subnets reachable by your clients (VPC peering / PrivateLink / overlay network)"
    compliance: {pci_dss: ["1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "200"]}

  - id: KAFKA-NET-003
    title: "Network segmentation: no cloud firewall opens broker ports to the world"
    severity: high
    category: security
    description: "advertised.listeners must not bind 0.0.0.0; AND every cloud-firewall collector that ran must report no INGRESS+ALLOW rule with 0.0.0.0/0 covering broker ports {9092,9094,9098}. Each cloud probe short-circuits when its SDK / token wasn't supplied."
    condition: "brokers.all(b, 'config' in b && 'advertised.listeners' in b.config && !b.config['advertised.listeners'].contains('://0.0.0.0:')) && (!('any_sg_open_to_world' in aws) || !aws.any_sg_open_to_world) && (!('firewalls_open_to_world' in gcp) || !gcp.firewalls_open_to_world)"
    message: "advertised.listeners binds 0.0.0.0, OR an AWS SG / GCP firewall opens broker ports to 0.0.0.0/0"
    remediation: "Bind advertised.listeners to private DNS; tighten AWS SG and GCP firewall ingress to private subnets / corporate CIDRs"
    compliance: {pci_dss: ["1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

  - id: KAFKA-NET-004
    title: "No PLAINTEXT listeners"
    severity: critical
    category: security
    description: "Remove PLAINTEXT listeners; use SSL or SASL_SSL for all listeners"
    condition: "brokers.all(b, b.listeners.all(l, l.protocol != 'PLAINTEXT'))"
    message: "PLAINTEXT listener detected — cleartext traffic over the network"
    remediation: "Replace PLAINTEXT listeners with SSL or SASL_SSL"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-NET-005
    title: "K8s NetworkPolicy isolates Kafka pods"
    severity: high
    category: security
    description: "Run `kubectl get networkpolicies` in the broker namespace: at least one NetworkPolicy must select Kafka pods (app=kafka / strimzi.io/cluster / app.kubernetes.io/name=kafka) AND a cluster-wide default-deny NP must exist."
    requires: [k8s]
    condition: "k8s.kubectl_available && k8s.network_policies_count > 0 && (k8s.kafka_pods_count == 0 || k8s.kafka_pods_protected) && k8s.default_deny_present"
    message: "Kafka pods are not isolated: no NetworkPolicy selects them OR no default-deny NP exists"
    remediation: "Apply a default-deny NP plus a podSelector NP that targets your Kafka workload (app=kafka or strimzi.io/cluster=<name>)"
    compliance: {pci_dss: ["1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

  # ═══════════════ ZOOKEEPER SECURITY (4) ═══════════════
  - id: KAFKA-ZK-001
    title: "ZooKeeper ACLs enabled"
    severity: high
    category: security
    description: "Enable ZooKeeper ACLs to prevent unauthorized metadata access"
    condition: "cluster.mode == 'kraft' || (cluster.mode == 'zookeeper' && brokers.all(b, 'config' in b && 'zookeeper.set.acl' in b.config && b.config['zookeeper.set.acl'] == 'true'))"
    message: "ZooKeeper ACLs not enabled — metadata accessible without authorization"
    remediation: "Set zookeeper.set.acl=true"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["284", "862"]}

  - id: KAFKA-ZK-002
    title: "ZooKeeper SASL authentication"
    severity: high
    category: security
    description: "Configure SASL authentication for ZooKeeper"
    condition: "cluster.mode == 'kraft' || (cluster.mode == 'zookeeper' && brokers.all(b, 'config' in b && 'zookeeper.sasl.client' in b.config && b.config['zookeeper.sasl.client'] == 'true'))"
    message: "ZooKeeper SASL not enabled — ZK connections unauthenticated"
    remediation: "Set zookeeper.sasl.client=true"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-ZK-003
    title: "ZooKeeper mTLS enabled"
    severity: high
    category: security
    description: "Enable mTLS for ZooKeeper connections"
    condition: "cluster.mode == 'kraft' || (cluster.mode == 'zookeeper' && brokers.all(b, 'config' in b && 'zookeeper.ssl.client.enable' in b.config && b.config['zookeeper.ssl.client.enable'] == 'true'))"
    message: "ZooKeeper mTLS not enabled"
    remediation: "Set zookeeper.ssl.client.enable=true"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "IA-2"], cwe: ["319", "287"]}

  - id: KAFKA-ZK-004
    title: "ZooKeeper 4lw commands restricted (probed)"
    severity: medium
    category: security
    description: "On ZK mode, 4lw.commands.whitelist must be set to a closed list excluding dump/envi/wchs/wchc/wchp/stat/cons/mntr (probed via the 4lw `conf` command). KRaft clusters are exempt."
    requires_per_mode:
      zookeeper: [zk]
    condition: "cluster.mode == 'kraft' || (cluster.mode == 'zookeeper' && zk.reachable && zk.four_letter_whitelist_strict)"
    message: "ZooKeeper 4lw whitelist is open (`*`), unset, or contains a sensitive command (dump/envi/wchs/...)"
    remediation: "Set 4lw.commands.whitelist=ruok,srvr,conf in zoo.cfg (drop dump/envi/wchs/wchc/wchp/stat/cons/mntr)"
    compliance: {pci_dss: ["2.2"], nist: ["CM-7"], cwe: ["200", "749"]}

  # ═══════════════ KRAFT SECURITY (4) ═══════════════
  - id: KAFKA-KRAFT-001
    title: "KRaft controller authentication"
    severity: high
    category: security
    description: "Configure SASL or mTLS authentication for KRaft controllers"
    condition: "cluster.mode == 'zookeeper' || (cluster.mode == 'kraft' && brokers.all(b, 'config' in b && 'controller.listener.names' in b.config && 'listener.security.protocol.map' in b.config && b.config['listener.security.protocol.map'].contains('CONTROLLER:SASL_SSL')))"
    message: "Ensure KRaft controller communication uses SASL or mTLS"
    remediation: "Configure controller.quorum.voters with SASL_SSL listener"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-KRAFT-002
    title: "KRaft controller TLS encryption"
    severity: critical
    category: security
    description: "Enable TLS encryption for controller-to-broker communication"
    condition: "cluster.mode == 'zookeeper' || (cluster.mode == 'kraft' && brokers.all(b, 'config' in b && 'listener.security.protocol.map' in b.config && (b.config['listener.security.protocol.map'].contains('CONTROLLER:SSL') || b.config['listener.security.protocol.map'].contains('CONTROLLER:SASL_SSL'))))"
    message: "Ensure controller-to-broker communication uses TLS"
    remediation: "Configure controller.listener.names with SSL or SASL_SSL"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-KRAFT-003
    title: "KRaft metadata log protection"
    severity: high
    category: security
    description: "Secure metadata.log.dir with restricted filesystem permissions (700)"
    requires_per_mode:
      kraft: [filesystem]
    condition: "cluster.mode == 'zookeeper' || (cluster.mode == 'kraft' && 'files' in fs && 'meta.properties' in fs.files && (fs.files['meta.properties'].perms == '0640' || fs.files['meta.properties'].perms == '0600'))"
    message: "Verify metadata.log.dir has 700 permissions — contains ACLs and topic configs"
    remediation: "chmod 700 on metadata.log.dir, run broker as non-root"
    compliance: {pci_dss: ["2.2"], nist: ["AC-6", "CM-6"], cwe: ["732", "276"]}

  - id: KAFKA-KRAFT-004
    title: "Controller quorum >= 3 for HA"
    severity: high
    category: reliability
    description: "Deploy minimum 3 controllers for HA. Secure controller.quorum.voters"
    condition: "cluster.mode == 'zookeeper' || (cluster.mode == 'kraft' && cluster.voter_count >= 3)"
    message: "Deploy at least 3 KRaft controllers for high availability"
    remediation: "Deploy 3+ controllers, secure controller.quorum.voters configuration"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "AC-3"], cwe: ["287", "284"]}

  # ═══════════════ ECOSYSTEM: KAFKA CONNECT (7) ═══════════════
  # All require Connect collector [ecosystem]
  - id: KAFKA-CONNECT-001
    title: "Connect REST API authentication [ecosystem]"
    severity: high
    category: security
    description: "Enable authentication for Kafka Connect REST API"
    requires: [connect]
    condition: "connect.reachable && connect.requires_auth"
    message: "Connect REST API authentication requires Connect collector"
    remediation: "Enable HTTP Basic or mTLS auth on Connect REST API"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-CONNECT-002
    title: "Connect secret externalization [ecosystem]"
    severity: high
    category: security
    description: "Use ConfigProvider to externalize secrets from connector configs"
    requires: [filesystem]
    condition: "!('is_connect_node' in fs) || !fs.is_connect_node || ('config.providers' in fs.connect_properties && fs.connect_properties['config.providers'].size() > 0)"
    message: "Secrets should be externalized via ConfigProvider, not stored in connector configs"
    remediation: "Use FileConfigProvider or Vault ConfigProvider for secrets"
    compliance: {pci_dss: ["3.4"], nist: ["IA-5", "SC-28"], cwe: ["522", "798", "312"]}

  - id: KAFKA-CONNECT-003
    title: "Connect REST RBAC [ecosystem]"
    severity: medium
    category: security
    description: "Secure Connect REST API with RBAC via reverse proxy or RestExtension"
    requires: [connect, docs]
    condition: "connect.reachable && connect.requires_auth && docs.rbac_policy.exists"
    message: "Apache Kafka Connect lacks built-in REST RBAC — requires reverse proxy or custom RestExtension"
    remediation: "Use OAuth2 proxy, nginx, or Confluent RBAC for Connect REST access control"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-CONNECT-004
    title: "Connect REST API TLS [ecosystem]"
    severity: high
    category: security
    description: "Enable HTTPS for Kafka Connect REST endpoints"
    requires: [connect]
    condition: "connect.reachable && connect.tls"
    message: "Connect REST API should use HTTPS"
    remediation: "Set listeners=https:// and configure ssl.* settings"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-CONNECT-005
    title: "Connector config override policy [ecosystem]"
    severity: medium
    category: security
    description: "Set connector.client.config.override.policy=None"
    requires: [filesystem]
    condition: "!('is_connect_node' in fs) || !fs.is_connect_node || ('connector.client.config.override.policy' in fs.connect_properties && fs.connect_properties['connector.client.config.override.policy'] == 'None')"
    message: "Connector config override policy should be restrictive"
    remediation: "Set connector.client.config.override.policy=None or restrictive policy"
    compliance: {pci_dss: ["7.1"], nist: ["AC-6"], cwe: ["284"]}

  - id: KAFKA-CONNECT-006
    title: "Connector plugin allowlist [ecosystem]"
    severity: medium
    category: security
    description: "Restrict plugin.path to approved connector directories"
    requires: [filesystem]
    condition: "!('is_connect_node' in fs) || !fs.is_connect_node || ('plugin.path' in fs.connect_properties && fs.connect_properties['plugin.path'].size() > 0 && fs.connect_properties['plugin.path'].contains('/') && fs.connect_properties['plugin.path'] != '/usr/share/java')"
    message: "Plugin path should be restricted to approved connector directories"
    remediation: "Set plugin.path to approved directories with read-only permissions"
    compliance: {pci_dss: ["2.2"], nist: ["CM-7", "SI-7"], cwe: ["829"]}

  - id: KAFKA-CONNECT-007
    title: "Connect internal topics secured [ecosystem]"
    severity: high
    category: security
    description: "Secure Connect internal topics with ACLs and encryption"
    condition: "acl_meta.collected && acls.exists(a, a.resource_type == 'TOPIC' && a.permission_type == 'ALLOW' && (a.resource_name == 'connect-configs' || a.resource_name.startsWith('connect-config'))) && acls.exists(a, a.resource_type == 'TOPIC' && a.permission_type == 'ALLOW' && (a.resource_name == 'connect-offsets' || a.resource_name.startsWith('connect-offset'))) && acls.exists(a, a.resource_type == 'TOPIC' && a.permission_type == 'ALLOW' && (a.resource_name == 'connect-status' || a.resource_name.startsWith('connect-status')))"
    message: "Connect internal topics contain connector configs and credentials — must be secured"
    remediation: "Add ACLs and enable encryption for config/offset/status storage topics"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "SC-28"], cwe: ["862", "312"]}

  # ═══════════════ SCHEMA REGISTRY (4) ═══════════════
  - id: KAFKA-SR-001
    title: "Schema Registry authentication [ecosystem]"
    severity: high
    category: security
    description: "Enable authentication for Schema Registry API"
    requires: [schemaregistry]
    condition: "schemaregistry.reachable && schemaregistry.requires_auth"
    message: "Schema Registry authentication requires Schema Registry collector"
    remediation: "Use HTTPS with client certificates or bearer tokens for SR API"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5"], cwe: ["287", "306"]}

  - id: KAFKA-SR-002
    title: "Schema authorization (anonymous-write probe)"
    severity: high
    category: security
    description: "Anonymous POST to /subjects/{name}/versions must be rejected (401/403) on every subject; the registry must require auth on writes."
    requires: [schemaregistry]
    condition: "schemaregistry.reachable && !schemaregistry.write_anonymous_allowed && schemaregistry.all_subjects_require_auth"
    message: "Anonymous write to Schema Registry is allowed for at least one subject — anyone can register or evolve schemas"
    remediation: "Front the registry with kafka-schema-registry-security-plugin (or RBAC) and demand auth on POST /subjects/{}/versions"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["862", "863"]}

  - id: KAFKA-SR-003
    title: "Schema Registry TLS [ecosystem]"
    severity: high
    category: security
    description: "Enable HTTPS for Schema Registry API"
    requires: [schemaregistry]
    condition: "schemaregistry.reachable && schemaregistry.tls"
    message: "Schema Registry API should use HTTPS"
    remediation: "Configure HTTPS listener and kafkastore.security.protocol=SSL"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "311"]}

  - id: KAFKA-SR-004
    title: "Schema compatibility enforcement [ecosystem]"
    severity: medium
    category: security
    description: "Set schema compatibility mode to prevent breaking changes"
    requires: [schemaregistry]
    condition: "schemaregistry.reachable && schemaregistry.compatibility_protects_consumers"
    message: "Schema compatibility mode prevents breaking changes to data contracts"
    remediation: "Set compatibility mode to BACKWARD, FULL, or TRANSITIVE"
    compliance: {pci_dss: ["6.4"], nist: ["CM-3", "SI-10"], cwe: ["20"]}

  # ═══════════════ DATA PROTECTION (13) ═══════════════
  - id: KAFKA-DATA-001
    title: "Application-level message encryption (schema annotation OR topic config)"
    severity: high
    category: security
    description: "Sensitive topics must declare app-level encryption either via a schema annotation (@encrypt / x-encryption / confluent:tags PII) or via the data.encryption topic config"
    requires: [adminclient, schemaregistry]
    condition: "topic_meta.collected && schemaregistry.reachable && topics.filter(t, t.classification == 'restricted' || t.classification == 'confidential').all(t, ('data.encryption' in t.config && t.config['data.encryption'] == 'app') || schemaregistry.any_subject_with_encrypt_annotation)"
    message: "A restricted/confidential topic has neither data.encryption=app on the topic nor an @encrypt schema annotation"
    remediation: "Encrypt PII/PCI fields with AES-256-GCM before producing; tag the schema with @encrypt or set data.encryption=app on the topic"
    compliance: {pci_dss: ["3.4"], nist: ["SC-28", "SC-13"], cwe: ["311", "312"]}

  - id: KAFKA-DATA-002
    title: "External key management system (placeholder + provider class)"
    severity: high
    category: security
    description: "Sensitive broker configs must be resolved through a non-file/env config provider (Vault, AWS Secrets Manager, GCP, Azure Key Vault)"
    requires: [adminclient]
    condition: "kms.placeholders_found > 0 && kms.has_external_provider"
    message: "No external KMS provider in use, or no broker config value pulled from one"
    remediation: "Wire VaultConfigProvider / AwsSecretsManagerConfigProvider; reference secrets via ${vault:...} or ${aws:...}"
    compliance: {pci_dss: ["3.5", "3.6"], nist: ["SC-12", "SC-17"], cwe: ["321"]}

  - id: KAFKA-DATA-003
    title: "Data masking for non-production (Connect SMT + classification)"
    severity: medium
    category: security
    description: "A Connect MaskField / RegexRouter / ReplaceField transform is in use AND data classification is documented"
    requires: [connect, docs]
    condition: "connect.reachable && connect.any_mask_transform && docs.data_classification.exists"
    message: "No Connect MaskField/RegexRouter/ReplaceField SMT detected and/or no docs/data-classification.md"
    remediation: "Apply org.apache.kafka.connect.transforms.MaskField (or equivalent) on connectors that move PII; document classification levels"
    compliance: {pci_dss: ["3.4"], nist: ["AC-4", "SC-28"], cwe: ["200", "359"]}

  - id: KAFKA-DATA-004
    title: "Topic retention based on data classification"
    severity: medium
    category: operational
    description: "Configure retention.ms based on data classification and compliance requirements"
    condition: "topic_meta.collected && topics.all(t, t.internal || (t.retention_ms > 0))"
    message: "Topic retention should align with data classification policy"
    remediation: "Set retention.ms according to data classification: PII=90d, PCI=365d per policy"
    compliance: {pci_dss: ["3.1"], nist: ["AU-11"], cwe: ["212"]}

  - id: KAFKA-DATA-005
    title: "Compacted topics for GDPR compliance"
    severity: medium
    category: operational
    description: "Use log compaction for topics requiring data erasure (GDPR right to be forgotten)"
    requires: [docs]
    condition: "docs.data_classification.exists && (!('iac' in docs) || !topic_meta.collected || !topics.exists(t, t.has_classification) || topics.exists(t, !t.internal && t.cleanup_policy.contains('compact')))"
    message: "Compacted topics enable GDPR-compliant data erasure"
    remediation: "Use cleanup.policy=compact for topics subject to GDPR deletion requests"
    compliance: {pci_dss: ["3.1"], nist: ["MP-6"], cwe: ["212"]}

  - id: KAFKA-DATA-006
    title: "Data classification and tagging"
    severity: medium
    category: operational
    description: "Define data classification levels and tag events via headers or schema metadata"
    condition: "topic_meta.collected && topics.all(t, t.internal || t.has_classification)"
    message: "Data classification enables automated retention and access policies"
    remediation: "Use Kafka headers or schema metadata for data classification tags"
    compliance: {pci_dss: ["3.2"], nist: ["AC-16", "RA-2"], cwe: ["200", "359"]}

  - id: KAFKA-DATA-007
    title: "PII detection and quarantine (Connect masking SMT + DLQ)"
    severity: high
    category: security
    description: "A Connect masking SMT must be configured AND at least one DLQ topic declared for failed/quarantined records"
    requires: [connect]
    condition: "connect.reachable && connect.any_mask_transform && connect.any_dlq_topic_configured"
    message: "PII detection/quarantine is incomplete: missing masking SMT or no DLQ topic declared"
    remediation: "Add a MaskField / RegexRouter SMT on PII-bearing connectors and set errors.deadletterqueue.topic.name for every connector"
    compliance: {pci_dss: ["3.4"], nist: ["SI-4", "SC-28"], cwe: ["200", "359"]}

  - id: KAFKA-DATA-008
    title: "PII redaction in logs (no bare %message in PatternLayout)"
    severity: high
    category: security
    description: "Audit logger must be configured, log files must not be world-readable, AND the log4j PatternLayout must NOT contain a bare %m / %message / %msg directive that would dump topic payload to disk."
    requires: [filesystem]
    condition: "fs.audit_logger_configured && !fs.any_log_file_world_readable && fs.audit_layout_redacts_message"
    message: "log4j PatternLayout contains a bare %message directive — topic payloads will be written verbatim to the audit log"
    remediation: "Replace %m with structured MDC keys (%X{operation} %X{topic} %X{principal}); or wrap %m with a redaction filter"
    compliance: {pci_dss: ["10.5"], nist: ["AU-3", "AU-9"], cwe: ["532", "359"]}

  - id: KAFKA-DATA-009
    title: "Data contract enforcement (registry + ownership annotations OR contracts topic)"
    severity: medium
    category: operational
    description: "SR must enforce a non-NONE compatibility mode AND either a contracts topic exists (Confluent _data-contracts / Apicurio kafkasql-journal) OR every subject carries an owner annotation."
    requires: [schemaregistry, adminclient]
    condition: "schemaregistry.reachable && schemaregistry.subject_count > 0 && schemaregistry.compatibility_protects_consumers && (topic_meta.data_contracts_topic_present || schemaregistry.any_subject_with_owner_annotation)"
    message: "No data-contracts topic AND no schema carries an owner annotation — contracts can't be attributed"
    remediation: "Provision a _data-contracts (or apicurio-registry) topic, OR add a `\"owner\"` annotation to each schema"
    compliance: {pci_dss: ["6.5"], nist: ["SI-10", "CM-3"], cwe: ["20"]}

  - id: KAFKA-DATA-010
    title: "Streaming data quality validation (DLQ + schema compatibility)"
    severity: medium
    category: operational
    description: "Connectors must route bad records to a DLQ AND the registry must enforce a forward/backward compatibility mode"
    requires: [connect, schemaregistry]
    condition: "connect.reachable && schemaregistry.reachable && connect.connector_count > 0 && connect.any_dlq_topic_configured && schemaregistry.compatibility_protects_consumers"
    message: "Connect has no DLQ topic configured, or registry compatibility is NONE — bad records will silently break consumers"
    remediation: "Set errors.tolerance=all and errors.deadletterqueue.topic.name on every connector; pin registry global compatibility to BACKWARD or FORWARD"
    compliance: {pci_dss: ["10.4"], nist: ["SI-10", "AU-6"], cwe: ["20"]}

  - id: KAFKA-DATA-011
    title: "Data lineage tracking"
    severity: medium
    category: operational
    description: "Capture end-to-end data lineage for sensitive topics"
    condition: "topic_meta.collected && topics.exists(t, t.has_classification) && topics.filter(t, t.has_classification).all(t, t.owner.size() > 0)"
    message: "Data lineage enables audit impact analysis and compliance reporting"
    remediation: "Track data lineage from source to consumer for sensitive topics"
    compliance: {pci_dss: ["10.2"], nist: ["AU-3", "AU-12"], cwe: ["778", "223"]}

  - id: KAFKA-DATA-012
    title: "Data catalog registration"
    severity: low
    category: operational
    description: "Register Kafka topics, schemas, ownership in a data catalog"
    condition: "topic_meta.collected && topics.all(t, t.internal || (t.has_classification && t.owner.size() > 0))"
    message: "Data catalog enables topic discovery and access reviews"
    remediation: "Register topics/schemas/ownership in data catalog (Amundsen, DataHub, Atlan)"
    compliance: {nist: ["AC-2", "CM-8"]}

  - id: KAFKA-DATA-013
    title: "Tokenization for high-sensitivity fields (schema annotation OR topic config)"
    severity: high
    category: security
    description: "Restricted topics must declare tokenization either via a schema annotation (@tokenize / @tokenized / x-tokenization) or via the data.tokenized topic config"
    requires: [adminclient, schemaregistry]
    condition: "topic_meta.collected && schemaregistry.reachable && topics.filter(t, t.classification == 'restricted').all(t, ('data.tokenized' in t.config && t.config['data.tokenized'] == 'true') || schemaregistry.any_subject_with_tokenized_annotation)"
    message: "A restricted topic has neither data.tokenized=true nor a @tokenized schema annotation"
    remediation: "Apply format-preserving encryption or tokenization before data leaves the trust zone; tag the schema with @tokenized or set data.tokenized=true on the topic"
    compliance: {pci_dss: ["3.4"], nist: ["SC-28", "MP-6"], cwe: ["359", "312"]}

  # ═══════════════ OPERATIONS (11) ═══════════════
  - id: KAFKA-OPS-001
    title: "Regular security patching"
    severity: high
    category: operational
    description: "Maintain regular patching schedule for Kafka brokers and client libraries"
    requires: [process, docs]
    condition: "'kafka_version_major' in process && process.kafka_version_major >= 3 && docs.patching_log.exists && docs.patching_log.age_days <= 30"
    covered_by_kafka_flavor: [confluent-cloud, aws-msk, aiven, redpanda-cloud, azure-eventhubs]
    message: "Subscribe to Kafka security mailing list and monitor CVE databases"
    remediation: "Patch Kafka within 30 days of security release. Subscribe to users@kafka.apache.org"
    compliance: {pci_dss: ["6.3"], nist: ["SI-2", "CM-3"], cwe: ["1104"]}

  - id: KAFKA-OPS-002
    title: "Configuration hardening (broker config + CIS report ≥ 90% pass)"
    severity: high
    category: security
    description: "Hardening must show on two axes: broker-level safe defaults (auto.create.topics=false, unclean.leader=false, super.users set) AND a CIS benchmark report (cis-cat / kube-bench / inspec) with ≥ 90% controls passing."
    condition: "brokers.all(b, 'config' in b && b.config['auto.create.topics.enable'] == 'false' && b.config['unclean.leader.election.enable'] == 'false' && 'super.users' in b.config && b.config['super.users'].size() > 0) && (!('report_present' in cis) || (cis.report_present && cis.pass_ratio >= 0.9))"
    message: "Broker-level hardening missing OR CIS benchmark report below 90% pass ratio"
    remediation: "Pin auto.create.topics=false, unclean.leader.election=false, super.users; run cis-cat/kube-bench and pass --cis-report to feed the result"
    compliance: {pci_dss: ["2.2"], nist: ["CM-6", "CM-7"], cwe: ["1188", "798"]}

  - id: KAFKA-OPS-003
    title: "JMX authentication and TLS"
    severity: high
    category: security
    description: "Secure JMX endpoints with authentication and TLS"
    requires: [process]
    condition: "'cmdline' in process && process.cmdline.contains('com.sun.management.jmxremote.authenticate=true') && process.cmdline.contains('com.sun.management.jmxremote.ssl=true')"
    message: "JMX endpoints must be secured with authentication and TLS"
    remediation: "Set com.sun.management.jmxremote.authenticate=true and enable JMX TLS"
    compliance: {pci_dss: ["8.2", "4.1"], nist: ["IA-2", "SC-8", "AC-3"], cwe: ["306", "287", "319"]}

  - id: KAFKA-OPS-004
    title: "Admin client tools secured"
    severity: medium
    category: security
    description: "Restrict kafka-*.sh admin tools to authorized personnel"
    condition: "brokers.all(b, 'config' in b && 'super.users' in b.config && b.config['super.users'].size() > 0 && b.config['super.users'] != 'User:*' && b.config['super.users'] != '*' && !b.config['super.users'].startsWith('User:*;') && !b.config['super.users'].endsWith(';User:*') && !b.config['super.users'].contains(';User:*;'))"
    message: "Admin CLI tools should require authentication and be restricted to operators"
    remediation: "Configure client.properties with SASL_SSL and restrict access to admin tools"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["306", "862"]}

  - id: KAFKA-OPS-005
    title: "Encrypted Kafka backups (config provider in use)"
    severity: medium
    category: operational
    description: "Backup encryption keys must come from an external config provider (so the operator can rotate without touching disk-level properties)"
    requires: [adminclient]
    condition: "kms.has_external_provider && kms.placeholders_found > 0"
    covered_by_kafka_flavor: [confluent-cloud, aws-msk, aiven, redpanda-cloud]
    message: "Kafka backups rely on inline credentials — no external KMS is wired into broker configs"
    remediation: "Encrypt backup storage with AES-256; pull the key via ${vault:...} or ${aws:...} so rotation is centralised"
    compliance: {pci_dss: ["3.4"], nist: ["CP-9", "SC-28"], cwe: ["311", "312"]}

  - id: KAFKA-OPS-006
    title: "Config providers protect every sensitive key"
    severity: high
    category: security
    description: "sasl.jaas.config, ssl.keystore.password, ssl.key.password, ssl.truststore.password (and the kafkastore.* equivalents) must each resolve through a config provider on at least one broker"
    requires: [adminclient]
    condition: "kms.placeholders_found > 0 && size(kms.sensitive_keys_via_provider) > 0"
    message: "At least one sensitive config (sasl.jaas.config / ssl.*.password) is plaintext — no ${provider:path} placeholder found"
    remediation: "Set config.providers and use ${vault:...} / ${file:...} on sasl.jaas.config and every ssl.*.password"
    compliance: {pci_dss: ["3.4"], nist: ["IA-5", "SC-28"], cwe: ["522", "798", "312"]}

  - id: KAFKA-OPS-007
    title: "Non-root broker execution"
    severity: high
    category: security
    description: "Run brokers as non-root and restrict filesystem permissions"
    requires: [process]
    condition: "'uid' in process && 'open_files_soft' in process && !process.running_as_root && process.open_files_soft >= 100000"
    message: "Brokers should run as dedicated non-root user with restricted file permissions"
    remediation: "Create kafka user, chmod 750 on log.dirs/config/keystore/truststore"
    compliance: {pci_dss: ["2.2"], nist: ["AC-6", "CM-6"], cwe: ["732", "276"]}

  - id: KAFKA-OPS-008
    title: "Auto topic creation disabled"
    severity: medium
    category: security
    description: "Set auto.create.topics.enable=false"
    condition: "brokers.all(b, 'config' in b && 'auto.create.topics.enable' in b.config && b.config['auto.create.topics.enable'] == 'false')"
    message: "Auto topic creation enabled — unauthorized topics can be created implicitly"
    remediation: "Set auto.create.topics.enable=false"
    compliance: {pci_dss: ["2.2"], nist: ["CM-7"], cwe: ["284"]}

  - id: KAFKA-OPS-009
    title: "Infrastructure as Code (IaC)"
    severity: medium
    category: operational
    description: "Manage Kafka clusters, topics, ACLs via IaC/GitOps with code review"
    requires: [docs]
    condition: "docs.iac.exists"
    message: "IaC ensures reproducible, auditable infrastructure changes"
    remediation: "Use Terraform, Ansible, or Crossplane to manage Kafka config as code"
    compliance: {pci_dss: ["6.5"], nist: ["CM-2", "CM-6"]}

  - id: KAFKA-OPS-010
    title: "Dead Letter Queue configured on every connector"
    severity: medium
    category: operational
    description: "Every Connect connector must declare errors.deadletterqueue.topic.name; absent if no connectors exist"
    requires: [connect]
    condition: "connect.reachable && (size(connect.connectors) == 0 || connect.connector_configs.all(c, c.errors_dlq_topic != ''))"
    message: "At least one connector has no errors.deadletterqueue.topic.name set — failed records vanish silently"
    remediation: "Set errors.tolerance=all and errors.deadletterqueue.topic.name=<connector-dlq> on every connector"
    compliance: {pci_dss: ["10.4"], nist: ["SI-11", "AU-6"]}

  - id: KAFKA-OPS-011
    title: "Incident response runbooks"
    severity: medium
    category: operational
    description: "Maintain incident response runbooks for Kafka data incidents"
    requires: [docs]
    condition: "docs.incident_response.exists && docs.incident_response.size > 200"
    message: "Runbooks enable consistent incident response for Kafka failures"
    remediation: "Document runbooks for schema violations, lag spikes, data quality issues"
    compliance: {pci_dss: ["12.10"], nist: ["IR-4", "IR-5"]}

  # ═══════════════ MONITORING (6) ═══════════════
  - id: KAFKA-MON-001
    title: "Security metrics monitoring (auth-failure alert rule)"
    severity: high
    category: operational
    description: "An alerting rule must fire on authentication failures (kafka.network.RequestMetrics, sasl_authentication_failures, etc.)"
    requires: [alerts, filesystem]
    condition: "alerts.reachable && alerts.has_auth_failure_rule && 'files' in fs && fs.auth_logger_configured"
    message: "No auth-failure alert rule found in Prometheus AND no broker-side auth logger configured"
    remediation: "Add a Prometheus rule on kafka_server_brokertopicmetrics_failed_authentications_total or equivalent; keep kafka.authenticator at INFO+"
    compliance: {pci_dss: ["10.4"], nist: ["AU-6", "SI-4"], cwe: ["778", "223"]}

  - id: KAFKA-MON-002
    title: "Anomaly detection alert rule"
    severity: medium
    category: operational
    description: "An alerting rule must fire on anomalous broker behavior (stddev/spike/outlier on request rates, connection counts, throughput)"
    requires: [alerts]
    condition: "alerts.reachable && alerts.has_anomaly_rule"
    message: "No anomaly-detection alert rule found in Prometheus"
    remediation: "Add a Prometheus rule using stddev_over_time / predict_linear / quantile_over_time on broker metrics"
    compliance: {pci_dss: ["10.4"], nist: ["SI-4", "AU-6"], cwe: ["778", "223"]}

  - id: KAFKA-MON-003
    title: "Security alerts (auth failures + ACL changes + quota breaches)"
    severity: medium
    category: operational
    description: "Three alert rules required: auth failures, ACL changes/denials, quota breaches"
    requires: [alerts]
    condition: "alerts.reachable && alerts.has_auth_failure_rule && alerts.has_acl_change_rule && alerts.has_quota_breach_rule"
    message: "Prometheus is missing at least one of: auth-failure / ACL-change / quota-breach alert rules"
    remediation: "Add Prometheus alert rules covering authentication failures, ACL deny/audit events, and quota throttle-time breaches"
    compliance: {pci_dss: ["10.4"], nist: ["SI-4", "AU-6"], cwe: ["778", "223"]}

  - id: KAFKA-MON-004
    title: "Certificate expiry monitoring"
    severity: high
    category: operational
    description: "Monitor and alert on certificate expiry"
    requires: [tls, docs]
    condition: "docs.monitoring_alerts.exists && 'handshake_ok' in tls && tls.handshake_ok && tls.days_to_expiry >= 30"
    message: "Certificate expiry monitoring prevents TLS outages"
    remediation: "Alert when certificates expire within 30 days. Monitor TLS handshake failures"
    compliance: {pci_dss: ["10.6"], nist: ["SI-4", "AU-6"], cwe: ["324", "223"]}

  - id: KAFKA-MON-005
    title: "Consumer lag monitoring (live consumer JMX + Prometheus rule)"
    severity: medium
    category: operational
    description: "Consumer JMX targets must be reachable AND a Prometheus rule must fire on consumer lag"
    requires: [consumerjmx, alerts]
    condition: "consumer_jmx.any_target_reachable && alerts.reachable && alerts.has_consumer_lag_rule"
    message: "Consumer lag is not monitored: no consumer JMX target reachable, or no Prometheus consumer-lag rule"
    remediation: "Expose JMX on every consumer JVM and pass --consumer-jmx-host-ports; add a Prometheus rule on kafka.consumer:type=consumer-fetch-manager-metrics records-lag-max"
    compliance: {pci_dss: ["10.6"], nist: ["SI-4", "AU-6"], cwe: ["778", "223"]}

  - id: KAFKA-MON-006
    title: "Replication health alert rule + zero current under-replication"
    severity: high
    category: reliability
    description: "An alerting rule must fire on under-replicated/offline partitions, and the live cluster must currently have zero of either"
    requires: [alerts, adminclient]
    condition: "alerts.reachable && alerts.has_replication_health_rule && topic_meta.collected && topics.all(t, t.under_replicated_partitions == 0) && topics.all(t, t.offline_partitions == 0)"
    message: "No replication-health alert rule in Prometheus, or live cluster has under-replicated/offline partitions"
    remediation: "Add a Prometheus rule on kafka_server_replicamanager_under_replicated_partitions and kafka_controller_kafkacontroller_offline_partitions_count; investigate live URP/offline counts"
    compliance: {pci_dss: ["10.6"], nist: ["SI-4", "AU-6"], cwe: ["778", "223"]}

  # ═══════════════ KAFKA STREAMS (2) ═══════════════
  - id: KAFKA-STREAMS-001
    title: "Streams state.dir POSIX-protected (no world read/write)"
    severity: high
    category: security
    description: "When --streams-state-dir is provided, the directory and every immediate child must have permissions that exclude OTHERS_READ and OTHERS_WRITE (state stores hold materialized message payloads)."
    requires: [streams]
    condition: "!streams.state_dir_readable || streams.state_dir_secure"
    message: "Kafka Streams state.dir or one of its children is world-readable / world-writable"
    remediation: "chmod 700 {state.dir}/* and run the streams app as a non-root user"
    compliance: {pci_dss: ["3.4"], nist: ["SC-28", "AC-6"], cwe: ["311", "732"]}

  - id: KAFKA-STREAMS-002
    title: "Streams application has dedicated ACL coverage"
    severity: high
    category: security
    description: "When the StreamsCollector discovers an applicationId from JMX, the cluster must have at least one ACL ALLOW that targets a resource starting with that applicationId (the streams app's own topics: changelog/repartition)."
    requires: [streams, adminclient]
    condition: "size(streams.application_ids) == 0 || acl_meta.collected && streams.application_ids.all(app, acls.exists(a, a.permission_type == 'ALLOW' && a.resource_name.startsWith(app)))"
    message: "A discovered Streams applicationId has no matching ACL ALLOW rule on its changelog/repartition topics"
    remediation: "Apply ACLs for {applicationId}-* topics (changelog and repartition) to the streams principal"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "AC-3"], cwe: ["287", "862"]}

  # ═══════════════ REST PROXY (1) ═══════════════
  - id: KAFKA-REST-001
    title: "REST Proxy authentication and TLS [ecosystem]"
    severity: high
    category: security
    description: "Enable authentication and TLS for Kafka REST Proxy endpoints"
    requires: [restproxy]
    condition: "restproxy.reachable && restproxy.tls && restproxy.requires_auth"
    message: "REST Proxy requires authentication and TLS for production use"
    remediation: "Configure client.security.protocol=SSL and enable HTTPS on REST Proxy"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "IA-5", "SC-8"], cwe: ["287", "306", "319"]}

  # ═══════════════ MIRRORMAKER 2 (1) ═══════════════
  - id: KAFKA-MM2-001
    title: "MirrorMaker 2 secure replication [ecosystem]"
    severity: high
    category: security
    description: "Every MM2 connector config must set source.cluster.security.protocol AND target.cluster.security.protocol to SSL or SASL"
    requires: [connect]
    condition: "connect.reachable && connect.mm2_connector_present && connect.mm2_all_secure && connect.requires_auth"
    message: "A MirrorMaker 2 connector is using PLAINTEXT for source or target replication"
    remediation: "Pin source.cluster.security.protocol and target.cluster.security.protocol to SASL_SSL (or SSL) on every MM2 connector; restrict Connect REST with auth"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "AC-3", "SC-8"], cwe: ["287", "306", "862", "319"]}

  # ═══════════════ COLLECTOR-SPECIFIC (4) ═══════════════
  # Examples wiring filesystem / jmx / tls collectors. Each declares `requires:`;
  # if the collector isn't enabled the control resolves to `na` (not silent pass).
  - id: KAFKA-FS-001
    title: "JAAS file is not world-readable"
    severity: critical
    category: security
    description: "kafka_server_jaas.conf must not have read access for `others` (PCI 7.1, NIST AC-3)"
    requires: [filesystem]
    condition: "!fs.jaas_present || !fs.jaas_world_readable"
    message: "JAAS file is world-readable — credentials exposed to any local user"
    remediation: "chmod 0640 /etc/kafka/kafka_server_jaas.conf, owner kafka:kafka"
    compliance: {pci_dss: ["7.1"], nist: ["AC-3", "AC-6"], cwe: ["732", "276"]}

  - id: KAFKA-FS-002
    title: "Keystore files are not world-readable"
    severity: high
    category: security
    description: "JKS/PKCS12 keystores must not have read access for `others`"
    requires: [filesystem]
    condition: "!fs.any_keystore_world_readable"
    message: "A keystore file is world-readable — private key material exposed"
    remediation: "chmod 0640 on every *.jks/*.p12 and restrict to the kafka user/group"
    compliance: {pci_dss: ["3.5"], nist: ["SC-12", "AC-3"], cwe: ["732", "311"]}

  - id: KAFKA-JMX-001
    title: "No under-replicated partitions reported by broker"
    severity: high
    category: reliability
    description: "Broker JMX UnderReplicatedPartitions metric must be 0"
    requires: [jmx]
    condition: "'under_replicated_partitions' in jmx && 'offline_partitions_count' in jmx && jmx.under_replicated_partitions == 0 && jmx.offline_partitions_count == 0"
    message: "Broker reports under-replicated or offline partitions over JMX"
    remediation: "Investigate failing brokers, check ISR shrink rate and disk health"
    compliance: {nist: ["SI-4", "CP-10"], cwe: ["778"]}

  - id: KAFKA-TLS-001
    title: "Broker certificate has more than 30 days before expiry"
    severity: high
    category: security
    description: "Leaf certificate presented during handshake must not be expired or expiring soon"
    requires: [tls]
    condition: "'handshake_ok' in tls && !tls.plaintext_endpoint && tls.handshake_ok && tls.days_to_expiry >= 30"
    message: "Broker TLS certificate expires in less than 30 days (or already expired)"
    remediation: "Rotate broker certificates; automate via cert-manager / Vault PKI"
    compliance: {pci_dss: ["4.1"], nist: ["SC-12"], cwe: ["298", "324"]}

  # ═══════════════ CONFLUENT CLOUD (3) ═══════════════
  # Activate when --kafka-flavor=confluent-cloud OR bootstrap is on *.confluent.cloud.
  # The collector is gated on flavor or on --cc-api-key/secret.
  - id: KAFKA-CC-001
    title: "Confluent Cloud control-plane requires auth"
    severity: critical
    category: security
    description: "api.confluent.cloud and api.telemetry.confluent.cloud must reject anonymous calls (401/403)"
    requires: [confluentcloud]
    condition: "cc.api_reachable && cc.api_requires_auth && cc.metrics_api_reachable && cc.metrics_api_requires_auth"
    message: "Confluent Cloud API is reachable but does NOT require auth — credentials are likely cached client-side or the API is not what we think"
    remediation: "Investigate immediately; the only acceptable anonymous response is 401/403"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "AC-3"], cwe: ["287", "306"]}

  - id: KAFKA-CC-002
    title: "Confluent Cloud cluster is dedicated or enterprise"
    severity: medium
    category: security
    description: "Basic and Standard clusters share infrastructure with other tenants. PII / regulated workloads must run on Dedicated or Enterprise."
    requires: [confluentcloud]
    condition: "!cc.flavor_detected || !cc.api_authenticated || cc.dedicated_or_enterprise"
    message: "Confluent Cloud cluster is Basic or Standard — multi-tenant blast radius exposure"
    remediation: "Migrate regulated workloads to a Dedicated or Enterprise cluster"
    compliance: {pci_dss: ["1.3"], nist: ["SC-7", "SC-32"], cwe: ["668"]}

  - id: KAFKA-CC-003
    title: "Confluent Cloud private networking enabled"
    severity: high
    category: security
    description: "Cluster network spec must reference a private network (PrivateLink / VPC Peering / Transit Gateway). Public clusters are reachable from the open internet."
    requires: [confluentcloud]
    condition: "!cc.flavor_detected || !cc.api_authenticated || cc.private_networking"
    message: "Confluent Cloud cluster has no private-networking config — reachable from the public internet"
    remediation: "Bind the cluster to a Network resource (PrivateLink/Peered/TransitGateway)"
    compliance: {pci_dss: ["1.2", "1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

  # ═══════════════ AWS MSK (3) ═══════════════
  # Active when --kafka-flavor=aws-msk OR bootstrap is on *.kafka*.amazonaws.com.
  - id: KAFKA-AWS-001
    title: "AWS MSK encryption-at-rest enabled"
    severity: high
    category: security
    description: "MSK cluster must have encryption-at-rest configured (AWS-managed CMK or customer-managed)"
    requires: [awsmsk]
    condition: "!aws.flavor_detected || !aws.sdk_available || aws.encryption_at_rest"
    message: "MSK cluster has no encryption-at-rest configured"
    remediation: "Recreate the cluster with encryption.encryptionAtRest set to a KMS key"
    compliance: {pci_dss: ["3.4"], nist: ["SC-28"], cwe: ["311", "312"]}

  - id: KAFKA-AWS-002
    title: "AWS MSK public access disabled"
    severity: critical
    category: security
    description: "Public access on MSK exposes brokers to the open internet — must be DISABLED"
    requires: [awsmsk]
    condition: "!aws.flavor_detected || !aws.sdk_available || !aws.public_access"
    message: "AWS MSK cluster has public access enabled"
    remediation: "Set BrokerNodeGroupInfo.ConnectivityInfo.PublicAccess.Type=DISABLED"
    compliance: {pci_dss: ["1.2", "1.3"], nist: ["SC-7"], cwe: ["284", "923", "668"]}

  - id: KAFKA-AWS-003
    title: "AWS MSK security groups have no 0.0.0.0/0 ingress on broker ports"
    severity: critical
    category: security
    description: "EC2 SG ingress rules attached to the broker ENIs must not allow 0.0.0.0/0 on 9092/9094/9098"
    requires: [awsmsk]
    condition: "!aws.flavor_detected || !aws.sdk_available || !aws.any_sg_open_to_world"
    message: "An MSK broker security group allows 0.0.0.0/0 ingress on 9092/9094/9098"
    remediation: "Tighten the SG ingress rules to private subnets / VPC peering / corporate CIDRs only"
    compliance: {pci_dss: ["1.2", "1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

  # ═══════════════ AIVEN (3) ═══════════════
  - id: KAFKA-AIVEN-001
    title: "Aiven control-plane requires auth"
    severity: critical
    category: security
    description: "api.aiven.io must reject unauthenticated requests on /v1/me"
    requires: [aiven]
    condition: "aiven.api_reachable && aiven.api_requires_auth"
    message: "Aiven API does not require auth on /v1/me — credential discipline broken"
    remediation: "Investigate; the only acceptable anonymous response is 401/403"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "AC-3"], cwe: ["287", "306"]}

  - id: KAFKA-AIVEN-002
    title: "Aiven service has a non-empty IP filter"
    severity: high
    category: security
    description: "user_config.ip_filter must be set to a closed list of CIDRs (not empty, not containing 0.0.0.0/0). Without --aiven-token / --aiven-project / --aiven-service the check short-circuits."
    requires: [aiven]
    condition: "!aiven.flavor_detected || !aiven.service_present || (aiven.ip_filter_count > 0 && !aiven.ip_filter_open)"
    message: "Aiven service has empty ip_filter OR contains 0.0.0.0/0 — exposed to the open internet"
    remediation: "Set user_config.ip_filter to your office / VPN / VPC CIDRs only"
    compliance: {pci_dss: ["1.2", "1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

  - id: KAFKA-AIVEN-003
    title: "Aiven service auth methods include certificate or SASL"
    severity: high
    category: security
    description: "user_config.kafka_authentication_methods must enable certificate AND/OR SASL — never PLAINTEXT only"
    requires: [aiven]
    condition: "!aiven.flavor_detected || !aiven.service_present || aiven.kafka_authentication_methods.exists(m, m == 'certificate' || m == 'sasl')"
    message: "Aiven Kafka service has neither certificate nor SASL authentication enabled"
    remediation: "Enable certificate or SASL in kafka_authentication_methods"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2"], cwe: ["287", "306"]}

  # ═══════════════ REDPANDA CLOUD (3) ═══════════════
  - id: KAFKA-RP-001
    title: "Redpanda Cloud control-plane requires auth"
    severity: critical
    category: security
    description: "api.redpanda.com /v1beta2/users must reject anonymous calls"
    requires: [rpcloud]
    condition: "rpcloud.api_reachable && rpcloud.api_requires_auth"
    message: "Redpanda Cloud API does not require auth — credential discipline broken"
    remediation: "Investigate immediately; the only acceptable anonymous response is 401/403"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "AC-3"], cwe: ["287", "306"]}

  - id: KAFKA-RP-002
    title: "Redpanda Cloud cluster uses private connectivity"
    severity: high
    category: security
    description: "connection_type must be `private` (BYOC / private link) — `public` exposes the cluster on the open internet"
    requires: [rpcloud]
    condition: "!rpcloud.flavor_detected || !rpcloud.cluster_present || rpcloud.connection_type == 'private'"
    message: "Redpanda Cloud cluster uses public connectivity"
    remediation: "Migrate to a BYOC or PrivateLink-backed cluster (connection_type=private)"
    compliance: {pci_dss: ["1.2", "1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

  - id: KAFKA-RP-003
    title: "Redpanda Cloud cluster is not serverless for regulated workloads"
    severity: medium
    category: security
    description: "Serverless tiers share infrastructure across tenants; PII / regulated workloads must run on a Dedicated cluster"
    requires: [rpcloud]
    condition: "!rpcloud.flavor_detected || !rpcloud.cluster_present || !rpcloud.is_serverless"
    message: "Redpanda Cloud cluster is serverless — multi-tenant blast-radius surface"
    remediation: "For regulated workloads, run a Dedicated cluster (BYOC or VPC-isolated)"
    compliance: {pci_dss: ["1.3"], nist: ["SC-32"], cwe: ["668"]}

  # ═══════════════ AZURE EVENT HUBS (3) ═══════════════
  - id: KAFKA-AZURE-001
    title: "Azure ARM control-plane requires auth"
    severity: critical
    category: security
    description: "management.azure.com must reject anonymous /subscriptions calls"
    requires: [azure]
    condition: "azure.api_reachable && azure.api_requires_auth"
    message: "Azure ARM API does not require auth — token cache or proxy is leaking"
    remediation: "Investigate; the only acceptable anonymous response is 401/403"
    compliance: {pci_dss: ["8.2"], nist: ["IA-2", "AC-3"], cwe: ["287", "306"]}

  - id: KAFKA-AZURE-002
    title: "Azure Event Hubs minimum TLS version >= 1.2"
    severity: high
    category: security
    description: "namespace.properties.minimumTlsVersion must be 1.2 or higher"
    requires: [azure]
    condition: "!azure.flavor_detected || !azure.namespace_present || azure.minimum_tls_version == '1.2' || azure.minimum_tls_version == '1.3'"
    message: "Azure Event Hubs namespace allows TLS < 1.2"
    remediation: "Set minimumTlsVersion=1.2 on the namespace"
    compliance: {pci_dss: ["4.1"], nist: ["SC-8", "SC-13"], cwe: ["319", "327"]}

  - id: KAFKA-AZURE-003
    title: "Azure Event Hubs public network access disabled"
    severity: high
    category: security
    description: "namespace.properties.publicNetworkAccess must be Disabled when private endpoints are used; otherwise the namespace is reachable from the public internet"
    requires: [azure]
    condition: "!azure.flavor_detected || !azure.namespace_present || azure.public_network_access == 'Disabled' || azure.private_endpoints_count > 0"
    message: "Azure Event Hubs namespace is public AND has no private endpoints"
    remediation: "Set publicNetworkAccess=Disabled and provision a Private Endpoint"
    compliance: {pci_dss: ["1.2", "1.3"], nist: ["SC-7"], cwe: ["284", "923"]}

  # ═══════════════ GCP (1) ═══════════════
  - id: KAFKA-GCP-001
    title: "GCP firewall rules don't expose broker ports to the internet"
    severity: critical
    category: security
    description: "compute.googleapis.com firewall list: no INGRESS+ALLOW rule with sourceRanges=0.0.0.0/0 may cover broker ports {9092,9094,9098}"
    requires: [gcp]
    condition: "gcp.api_authenticated && !gcp.firewalls_open_to_world"
    message: "A GCP firewall rule allows 0.0.0.0/0 ingress on a Kafka broker port"
    remediation: "Tighten the firewall rule's sourceRanges to private subnets / corporate CIDRs; or restrict the targetTags so it doesn't apply to broker VMs"
    compliance: {pci_dss: ["1.2", "1.3"], nist: ["SC-7", "AC-4"], cwe: ["284", "923"]}

scoring:
  weights:
    critical: 15
    high: 10
    medium: 5
    low: 2
    info: 0
  pass_threshold: 70
  thresholds:
    excellent: 90
    good: 75
    poor: 50
    critical_gap: 0
