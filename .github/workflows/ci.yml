name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build (compile + linters)
        # PMD 7.x ASM parser crashes (StackOverflowError) on Java 25 records inside
        # cold worker JVMs; skip pmdMain on CI until PMD ships a Java 25 fix.
        run: gradle build -x test -x pmdMain

      - name: Run tests (unit + Testcontainers integration)
        run: gradle test

      - name: Build distribution
        run: gradle installDist -x test -x check

      - name: Smoke-test scanner against ephemeral Kafka
        run: |
          docker run -d --name kafka-ci -p 19092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-ci:9093 \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:19092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e CLUSTER_ID=ci-cluster \
            apache/kafka:4.0.0
          for i in $(seq 1 60); do nc -z localhost 19092 && break; sleep 1; done
          sleep 30
          docker logs kafka-ci 2>&1 | tail -10
          ./build/install/kafka-security-scanner/bin/kafka-security-scanner \
            --bootstrap localhost:19092 \
            --policy policies/test-minimal-valid.yaml \
            --format json,sarif,html,csv \
            --out reports \
            --timeout 60 \
            --fail-on none
          test -f reports/report.json
          test -f reports/report.sarif
          test -f reports/report.html
          test -f reports/report.csv

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/report.sarif
        continue-on-error: true

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: reports/

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
