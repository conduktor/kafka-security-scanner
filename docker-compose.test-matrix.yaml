# Kafka Security Scanner — Deep E2E Test Matrix
# Covers Apache Kafka (5 variants) + Redpanda (2 variants) + 3-broker cluster

x-kafka-cluster3-env: &cluster3-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka42-cluster3-1:9093,2@kafka42-cluster3-2:9093,3@kafka42-cluster3-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  CLUSTER_ID: kafka42-cluster3

services:
  # ═══════════════ APACHE KAFKA ═══════════════

  # Variant 1: Kafka 4.2 KRaft — PLAINTEXT (insecure baseline)
  kafka-42-plaintext:
    image: apache/kafka:4.2.0
    hostname: kafka42-plaintext
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka42-plaintext:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: kafka42-plaintext
    ports: ["19092:9092"]
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20

  # Variant 2: Kafka 4.2 KRaft — SASL_PLAINTEXT + PLAIN (secured, inline JAAS)
  kafka-42-sasl:
    image: apache/kafka:4.2.0
    hostname: kafka42-sasl
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka42-sasl:9093
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: '-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_SUPER_USERS: "User:admin"
      CLUSTER_ID: kafka42-sasl-cluster
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    ports: ["29092:9092"]
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20

  # Variant 3: Kafka 3.9 KRaft — PLAINTEXT (older version)
  # NOTE: 3.9 StorageTool validates advertised.listeners against ALL listeners
  # (fixed in 4.x). CONTROLLER must bind to a routable hostname, not 0.0.0.0.
  kafka-39-plaintext:
    image: apache/kafka:3.9.0
    hostname: kafka39-plaintext
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka39-plaintext:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka39-plaintext:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: kafka39-plaintext
    ports: ["39092:9092"]
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20

  # Variant 4: Kafka 4.2 with ACLs + StandardAuthorizer
  kafka-42-acl:
    image: apache/kafka:4.2.0
    hostname: kafka42-acl
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka42-acl:9093
      # INTERNAL listener (PLAINTEXT, ANONYMOUS-as-superuser) is used by the test
      # script to bootstrap ACLs from inside the container — the SASL listener's
      # advertised localhost:49092 isn't reachable from within the docker network.
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:49092,INTERNAL://kafka42-acl:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: '-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # ANONYMOUS is required because CONTROLLER and INTERNAL listeners are PLAINTEXT.
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: kafka42-acl-cluster
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    ports: ["49092:9092"]
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20

  # ═══════════════ REDPANDA ═══════════════

  # Variant 5: Redpanda latest — PLAINTEXT
  redpanda-plaintext:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    hostname: redpanda-plaintext
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:59092
      - --pandaproxy-addr 0.0.0.0:8082
      - --mode dev-container
    ports: ["59092:9092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      retries: 20

  # Variant 6: Redpanda latest — SASL_PLAINTEXT + SCRAM-SHA-256
  # Cluster-level properties (enable_sasl, sasl_mechanisms, etc.) must come from
  # a bootstrap yaml — `--set redpanda.*` only handles node config.
  redpanda-sasl:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    hostname: redpanda-sasl
    environment:
      RP_BOOTSTRAP_USER: "admin:admin-secret:SCRAM-SHA-256"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cp /tmp/redpanda.yaml /etc/redpanda/redpanda.yaml &&
        exec /entrypoint.sh redpanda start --smp 1 --overprovisioned --pandaproxy-addr 0.0.0.0:8082 --mode dev-container
    volumes:
      - ./secrets/redpanda.yaml:/tmp/redpanda.yaml:ro
      - ./secrets/redpanda-bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
    ports: ["65093:9092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      retries: 20

  # ═══════════════ ADDITIONAL VARIANTS FOR COLLECTOR COVERAGE ═══════════════

  # Variant 7: Kafka 4.2 plaintext with JMX exposed on host port 9999.
  # Lets the scanner exercise the jmx collector against a real broker.
  kafka-42-jmx:
    image: apache/kafka:4.2.0
    hostname: kafka42-jmx
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka42-jmx:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:14092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: kafka42-jmx-cluster
      # Expose JMX over RMI on 9999 with no auth (test only).
      KAFKA_JMX_PORT: "9999"
      KAFKA_JMX_HOSTNAME: "localhost"
      KAFKA_JMX_OPTS: >-
        -Dcom.sun.management.jmxremote=true
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.port=9999
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Djava.rmi.server.hostname=localhost
    ports:
      - "14092:9092"
      - "9999:9999"
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20

  # Variant 8: Kafka 4.2 KRaft 3-broker cluster. Each node is broker+controller
  # in combined mode. Validates that the AdminClient collector handles N brokers.
  kafka-42-cluster3-1:
    image: apache/kafka:4.2.0
    hostname: kafka42-cluster3-1
    environment:
      <<: *cluster3-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka42-cluster3-1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:13092
    ports: ["13092:9092"]
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20

  kafka-42-cluster3-2:
    image: apache/kafka:4.2.0
    hostname: kafka42-cluster3-2
    environment:
      <<: *cluster3-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka42-cluster3-2:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:13093
    ports: ["13093:9092"]
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20

  kafka-42-cluster3-3:
    image: apache/kafka:4.2.0
    hostname: kafka42-cluster3-3
    environment:
      <<: *cluster3-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka42-cluster3-3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:13094
    ports: ["13094:9092"]
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "9092"]
      interval: 5s
      retries: 20
